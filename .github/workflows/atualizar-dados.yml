# Roda o robô de dados todo dia útil e publica o site na Cloudflare Pages (usemilhao.com.br).
# Custo: zero em repositório público (GitHub Actions e Cloudflare Pages gratuitos).
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "30 23 * * 1-5"   # 20h30 em Brasília, depois do fechamento da B3
  workflow_dispatch: {}        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dados-e-site:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEM_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas requests pillow

      - name: Reaproveitar arquivos já baixados
        uses: actions/cache@v4
        with:
          path: .cache-dados
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Rodar o robô de dados
        run: python etl/milhao_dados.py --saida site/data --cache .cache-dados

      # confere dado a dado antes de publicar; se achar erro em massa, para aqui e o site fica com os dados de ontem
      - name: Conferir os dados, dado a dado
        run: python etl/conferencia.py --dados site/data --anterior https://milhao.pages.dev/data

      - name: Montar o site
        run: cp index.html _headers site/ && python etl/icones.py --saida site && touch site/.nojekyll

      # o site vai para milhao.pages.dev (Cloudflare Pages, plano gratuito), que atende usemilhao.com.br
      - uses: actions/setup-node@v4
        if: env.TEM_CLOUDFLARE == 'true'
        with:
          node-version: "22"

      - name: Publicar em milhao.pages.dev
        if: env.TEM_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ffd7b733a271c34277fe05f94787d20c
        run: |
          npx --yes wrangler pages project create milhao --production-branch main || true
          npx --yes wrangler pages deploy site --project-name milhao --branch main --commit-dirty=true
