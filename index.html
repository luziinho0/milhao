<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if (location.hostname === "milhao.pages.dev") location.replace("https://usemilhao.com.br" + location.pathname + location.search + location.hash);</script>
<script>try { if (localStorage.getItem("milhao:tema") === "escuro") document.documentElement.dataset.tema = "escuro"; if (sessionStorage.getItem("milhao:abertura")) document.documentElement.classList.add("sem-abertura"); } catch (e) {}</script>
<title>Milhão.</title>
<!-- ícone "M." para o atalho na tela inicial do celular (gerado por etl/icones.py) -->
<meta name="theme-color" content="#13241C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milhão">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* tela de abertura: o "M." se forma, o ponto verde vira cursor e digita "ilhão"; depois aparece o bordão */
#abertura{position:fixed;inset:0;z-index:9999;background:#13241C;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease,visibility 0s .4s}
.sem-abertura #abertura{display:none}
#abertura.saindo{opacity:0;visibility:hidden}
#abertura .ab-bloco{position:relative;line-height:0;transition:transform .4s cubic-bezier(.4,0,.2,1)}
#abertura.saindo .ab-bloco{transform:scale(1.04)}
#abertura svg{width:min(76vw,400px);height:auto;overflow:visible}
#abertura text{font-family:var(--fonte);font-weight:850;font-stretch:125%;font-variation-settings:"wdth" 125;fill:#fff}
#abertura .ab-m{fill:#fff;clip-path:inset(100% 0 0 0)}
#abertura .ab-ponto{fill:#2FCB8F;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
#abertura .ab-tag{position:absolute;left:50%;top:100%;margin-top:clamp(14px,4vw,22px);transform:translateX(-50%);white-space:nowrap;line-height:1.2;font-family:var(--fonte);font-weight:500;color:#C9D6CF;font-size:clamp(14px,3.9vw,18px);opacity:0}
:root{
  --verde:#0B6E4F; --verde-2:#0F8A62; --verde-claro:#E3F0EA;
  --tinta:#13241C; --tinta-2:#4A5D53; --tinta-3:#7B8C83;
  --papel:#F4F7F5; --branco:#FFFFFF; --linha:#DCE4DF; --linha-2:#EBF0ED;
  --queda:#B93A26; --queda-claro:#F7E4E0;
  --ouro:#A97A1C; --ouro-claro:#F5ECD8;
  --fonte:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
:root[data-tema=escuro]{
  --verde:#1E9E70; --verde-2:#2FCB8F; --verde-claro:#173A2D;
  --tinta:#E6EEEA; --tinta-2:#AABAB2; --tinta-3:#7F9188;
  --papel:#0E1613; --branco:#16211C; --linha:#2A3832; --linha-2:#212D28;
  --queda:#F0806B; --queda-claro:#3B201B;
  --ouro:#D9A642; --ouro-claro:#2F2617;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fonte);font-size:15px;line-height:1.45}
body{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.marca{font-weight:850;font-stretch:125%;font-variation-settings:"wdth" 125;letter-spacing:-.02em;color:var(--verde);line-height:1}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:30px;font-weight:750;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:650}
.sutil{color:var(--tinta-2)}
.fraco{color:var(--tinta-3);font-size:13px}
.alta{color:var(--verde)} .baixa{color:var(--queda)}
.ouro{color:var(--ouro)}
.btn{border:1px solid var(--linha);background:var(--branco);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--tinta-3)}
.btn.primario{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.primario:hover{background:var(--verde-2)}
.btn.texto{border:none;background:none;padding:6px 8px;color:var(--verde)}
.btn.perigo{color:var(--queda)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select{
  border:1px solid var(--linha);background:var(--branco);border-radius:8px;padding:8px 10px;width:100%}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tinta-2);font-weight:550}
.oculto{display:none!important}

/* ---------- entrada ---------- */
.entrada{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.entrada-arte{background:var(--tinta);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;isolation:isolate}
.entrada-arte p{max-width:420px;color:#C9D6CF;font-size:17px;position:relative;margin:0;z-index:2}
.entrada-arte::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(transparent,var(--tinta) 65%);z-index:1;pointer-events:none}
/* marca */
.logo{display:inline-flex;align-items:center;gap:.22em;line-height:1;white-space:nowrap}
.logo .logo-m{width:1.1em;height:1.1em;flex:none;margin-right:.12em}
[data-tema=escuro] .logo .lm-fundo{fill:#1C3328}
.logo-nome{font-weight:850;font-stretch:125%;font-variation-settings:"wdth" 125;letter-spacing:-.025em;color:var(--verde)}
.logo-nome i{font-style:normal;color:#2FCB8F}
.logo.grande{font-size:clamp(60px,7.4vw,118px)}
.logo.grande .logo-nome{color:#fff}
.logo.media{font-size:38px}
.logo.pequena{font-size:27px}
.marca-link{text-decoration:none;padding:0 8px;display:inline-block}
/* lupa sobre a marca */
.lupa-area{position:relative;align-self:flex-start;cursor:none;z-index:2;padding:6px}
.lupa{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:50%;overflow:hidden;pointer-events:none;
  background:var(--tinta);border:3px solid #E9F7F0;box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.25);
  opacity:0;scale:.6;transition:opacity .18s,scale .18s}
.lupa::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),transparent 46%)}
.lupa-conteudo{position:absolute;left:0;top:0;transform-origin:0 0;padding:6px}
.lupa-area.com-lupa .lupa{opacity:1;scale:1}
/* velas */
.velas{position:absolute;left:0;right:0;bottom:118px;width:100%;height:230px;z-index:1}
.velas .vela{transform-box:fill-box;transform-origin:50% 100%;animation:vela-sobe .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i) * 22ms)}
@keyframes vela-sobe{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
/* telão de cotações ao fundo */
.telao{position:absolute;inset:-25% -20%;z-index:0;opacity:.17;transform:perspective(1100px) rotateX(24deg) rotateZ(-9deg);
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 72%);pointer-events:none}
.telao-rolo{animation:telao-rola 90s linear infinite}
.telao-grade{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding-bottom:2px}
.telao-grade div{background:rgba(47,203,143,.07);border:1px solid rgba(47,203,143,.18);padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.telao-grade b{font-size:15px;letter-spacing:.02em;color:#E9F7F0}
.telao-grade span{font-size:13px;color:#C9D6CF}
.telao-grade em{font-style:normal;font-size:13px;font-weight:700}
.telao-grade .sobe{color:#2FCB8F}.telao-grade .desce{color:#F08A75}
@keyframes telao-rola{to{transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce){.telao-rolo,.velas .vela{animation:none}.lupa{transition:none}}
@media (hover:none){.lupa{display:none}.lupa-area{cursor:auto}}
.entrada-form{display:flex;align-items:center;justify-content:center;padding:28px}
.entrada-form form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:11px}
.entrada-form h1{margin-bottom:4px}
.entrada-form label.campo{gap:3px}
.entrada-form .nota{font-size:13px;color:var(--tinta-3)}
.entrada-form .esqueci{font-size:14px;color:var(--verde);font-weight:600;margin-top:-6px;align-self:flex-start}
.entrada-form .sutil a{color:var(--verde);font-weight:600}
.erro-login{margin:0;background:var(--queda-claro);color:var(--queda);border-radius:8px;padding:10px 12px;font-size:14px}

/* ---------- moldura ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(to right,var(--branco) 247px,var(--linha) 247px,var(--linha) 248px,transparent 248px)}
.lateral{padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.lateral .marca{font-size:30px;padding:0 8px}
.lateral .marca-link{margin-bottom:2px}
.carteira-atual{border:1px solid var(--linha);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--papel);text-align:left;width:100%}
.carteira-atual small{display:block;color:var(--tinta-3);font-size:12px}
.carteira-atual strong{font-weight:650}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-weight:550;color:var(--tinta-2)}
nav.menu a:hover{background:var(--papel);color:var(--tinta)}
nav.menu a.ativo{background:var(--verde-claro);color:var(--verde)}
nav.menu svg{width:18px;height:18px;flex:none}
nav.menu svg,.servicos svg{transition:transform .2s ease;transform-origin:center}
nav.menu a:hover svg,.servicos a:hover svg{animation:ico-pop .4s ease}
nav.menu a[href="#proventos"]:hover svg,.servicos a[href="#proventos"]:hover svg{animation:ico-spin .6s ease}
nav.menu a[href="#analise"]:hover svg,.servicos a[href="#analise"]:hover svg{animation:ico-bars .5s ease}
nav.menu a[href="#indicadores"]:hover svg,.servicos a[href="#indicadores"]:hover svg{animation:ico-rise .5s ease}
nav.menu a[href="#agenda"]:hover svg,.servicos a[href="#agenda"]:hover svg{animation:ico-wobble .5s ease}
nav.menu a[href="#comparar"]:hover svg,.servicos a[href="#comparar"]:hover svg{animation:ico-swap .45s ease}
nav.menu a[href="#consolidador"]:hover svg,.servicos a[href="#consolidador"]:hover svg{animation:ico-rise .5s ease}
@keyframes ico-pop{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-7deg)}100%{transform:scale(1.1)}}
@keyframes ico-spin{to{transform:rotate(360deg)}}
@keyframes ico-bars{0%,100%{transform:scaleY(1)}30%{transform:scaleY(.65)}65%{transform:scaleY(1.18)}}
@keyframes ico-rise{0%{transform:translate(0,0)}50%{transform:translate(2px,-3px)}100%{transform:translate(0,0)}}
@keyframes ico-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes ico-swap{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}70%{transform:translateX(2px)}}
.lateral .rodape{margin-top:auto;font-size:12px;color:var(--tinta-3);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.principal{min-width:0}
.topo{display:flex;align-items:center;gap:16px;padding:16px 36px;border-bottom:1px solid var(--linha);background:var(--papel);position:sticky;top:0;z-index:5}
.busca{position:relative;flex:1;max-width:520px}
.busca input{padding-left:36px;background:var(--branco)}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tinta-3)}
.sugestoes{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);box-shadow:0 8px 24px rgba(19,36,28,.08);overflow:hidden;z-index:20}
.sugestoes button{display:flex;width:100%;gap:12px;align-items:baseline;padding:9px 12px;border:none;background:none;cursor:pointer;text-align:left}
.sugestoes button:hover,.sugestoes button.sel{background:var(--papel)}
.sugestoes b{width:64px;flex:none}
.topo .usuario{margin-left:auto;font-size:13px;color:var(--tinta-2)}
/* barra de serviços da tela inicial */
.barra-topo{position:sticky;top:0;z-index:6;background:var(--branco);border-bottom:1px solid var(--linha)}
.barra-dentro{max-width:1280px;margin:0 auto;padding:10px 36px;display:flex;flex-wrap:wrap;align-items:center;gap:20px;row-gap:6px}
.barra-topo .marca-link{padding:0}
.barra-topo .logo.pequena{font-size:24px}
.servicos{display:flex;flex-wrap:nowrap;gap:4px;scrollbar-width:none;order:5;width:100%;margin:4px 0 0}
.servicos::-webkit-scrollbar{display:none}
/* cada serviço em pé: ícone em cima, nome embaixo, todos na mesma linha */
.servicos a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:9px 4px 8px;border-radius:10px;text-decoration:none;font-weight:600;font-size:12.5px;line-height:1.2;text-align:center;color:var(--tinta-2)}
.servicos a:hover{background:var(--verde-claro);color:var(--verde)}
.servicos svg{width:21px;height:21px;flex:none}
@media (max-width:900px){.servicos{overflow-x:auto}.servicos a{flex:0 0 auto;min-width:84px;max-width:100px}}
.barra-topo .busca{margin-left:auto;max-width:280px;min-width:214px}
.barra-topo .usuario{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--tinta-2);white-space:nowrap}
@media (max-width:700px){.barra-topo{position:static}.barra-dentro{padding:10px 18px;gap:12px}.servicos{overflow-x:auto;margin:0 -18px;padding:0 12px;width:calc(100% + 36px)}.servicos a{flex:0 0 auto;min-width:76px;max-width:96px}.barra-topo .busca{order:6;max-width:none;width:100%;margin-left:0}.barra-topo .usuario{margin-left:auto}.barra-topo .usuario .nome{display:none}}
.demo{background:var(--ouro-claro);color:#6B4D10;padding:9px 36px;font-size:13px;border-bottom:1px solid #E8D8B0}
.conteudo{padding:28px 36px 64px;max-width:1280px}

/* ---------- blocos ---------- */
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.cabeca .acoes{display:flex;gap:8px;flex-wrap:wrap}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:20px 22px}
.painel + .painel,.grade + .painel,.painel + .grade,.numeros + .painel,.numeros + .grade{margin-top:18px}
.painel h2{margin-bottom:14px}
.grade{display:grid;gap:18px}
.grade > .painel,.grade > div > .painel:first-child{margin-top:0}
.g-2{grid-template-columns:1fr 1fr}
.g-ativo{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--linha);border-radius:var(--r);background:var(--branco)}
.numeros > div{padding:14px 18px;border-right:1px solid var(--linha-2)}
.numeros > div:last-child{border-right:none}
.numeros > div > span{display:block;font-size:13px;color:var(--tinta-2)}
.numeros strong{display:block;font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.numeros small{font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--linha-2);white-space:nowrap}
th{font-size:12.5px;font-weight:600;color:var(--tinta-2);background:var(--branco);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.esq,th.esq{text-align:left}
tbody tr:hover{background:#F8FAF9}
th.ordena{cursor:pointer;user-select:none}
th.ordena:hover{color:var(--tinta)}
th.ordena[aria-sort=descending]::after{content:" ▾"} th.ordena[aria-sort=ascending]::after{content:" ▴"}
.tk{font-weight:700;text-decoration:none}
.tk:hover{color:var(--verde)}
.tk + small{display:block;color:var(--tinta-3);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.rolagem{overflow:auto;max-height:640px;border:1px solid var(--linha);border-radius:var(--r);background:var(--branco)}
.vazio{padding:36px;text-align:center;color:var(--tinta-2)}
.vazio h3{margin-bottom:6px;color:var(--tinta)}
.vazio .acoes{margin-top:14px;display:flex;gap:8px;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:550}
.chip[aria-pressed=true]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:18px}
.abas button{border:none;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--tinta-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--verde)}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 18px}
.faixa{display:flex;gap:6px}
.selo{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--linha-2);color:var(--tinta-2)}
.selo.fii{background:var(--ouro-claro);color:#7A5710}

/* ---------- ativo ---------- */
.ativo-cab h1{font-size:44px;font-weight:800;font-stretch:112%;letter-spacing:-.02em}
.ativo-cab .preco{font-size:34px;font-weight:700;letter-spacing:-.01em;text-align:right}
.periodos{display:flex;gap:4px}
.periodos button{border:none;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--tinta-2);font-size:13px}
.periodos button[aria-pressed=true]{background:var(--tinta);color:#fff}
.grafico{position:relative}
.grafico svg{display:block;width:100%}
.dica{position:absolute;pointer-events:none;background:var(--tinta);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%)}
.ind-grupo{margin-bottom:6px}
.ind-grupo h3{margin:14px 0 4px;font-size:13.5px;color:var(--tinta-2)}
.ind-grupo:first-child h3{margin-top:0}
.ind-linha{display:grid;grid-template-columns:1fr 90px 120px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linha-2);font-size:14px}
.ind-linha strong{text-align:right;font-weight:650}
.ind-linha .cmp{text-align:right;font-size:12.5px;color:var(--tinta-3)}
.valor-justo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.valor-justo div{border:1px solid var(--linha-2);border-radius:8px;padding:12px}
.valor-justo span{font-size:13px;color:var(--tinta-2);display:block}
.valor-justo strong{font-size:22px;display:block;margin:2px 0}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--linha-2);font-size:14px}
.checklist li:last-child{border-bottom:none}
.checklist i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;margin-top:1px}
.checklist .sim i{background:var(--verde-claro);color:var(--verde)}
.checklist .nao i{background:var(--queda-claro);color:var(--queda)}
.placar{font-size:13px;color:var(--tinta-2);margin:-8px 0 10px}
.placar b{font-size:18px;color:var(--tinta)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--linha-2);font-size:14px}
.info span{color:var(--tinta-2)}

/* ---------- carteira ---------- */
.lista-carteiras{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lista-carteiras button{text-align:left;border:1px solid var(--linha);background:var(--branco);border-radius:var(--r);padding:18px;cursor:pointer}
.lista-carteiras button:hover{border-color:var(--verde)}

/* modo escuro: o que usa cor fixa */
[data-tema=escuro] .entrada-arte{background:#0A120F}
[data-tema=escuro] .entrada-arte::after{background:linear-gradient(transparent,#0A120F 65%)}
[data-tema=escuro] .chip[aria-pressed=true],[data-tema=escuro] .periodos button[aria-pressed=true],[data-tema=escuro] .analise-ativos button[aria-pressed=true],
[data-tema=escuro] .dica,[data-tema=escuro] .aviso{color:var(--papel)}
[data-tema=escuro] .aviso-acao{color:var(--verde)}
[data-tema=escuro] .demo,[data-tema=escuro] .imp-nota{color:var(--ouro);border-color:var(--linha)}
[data-tema=escuro] .selo.fii{color:var(--ouro)}
[data-tema=escuro] tbody tr:hover{background:#1A2621}
[data-tema=escuro] .painel.teto,[data-tema=escuro] .veredito{border-color:var(--linha)}
[data-tema=escuro] dialog::backdrop{background:rgba(0,0,0,.55)}
[data-tema=escuro] .velas-tela canvas,[data-tema=escuro] img{color-scheme:dark}
/* troca suave entre claro e escuro */
html.vt-tema::view-transition-old(root),html.vt-tema::view-transition-new(root){animation-duration:.55s;animation-timing-function:ease-in-out}
html.tema-suave,html.tema-suave *,html.tema-suave *::before,html.tema-suave *::after{transition:background-color .5s ease,color .5s ease,border-color .5s ease,fill .5s ease,stroke .5s ease!important}
.btn-tema svg{transition:transform .5s ease}
.btn-tema:active svg{transform:rotate(-30deg)}

.filtrao-botao:hover .filtrao-cena{transform:translateY(-3px) rotate(-4deg)}
.filtrao-botao .filtrao-boneco{animation:respirar 4.5s ease-in-out infinite;transform:translateZ(0);filter:drop-shadow(0 4px 8px rgba(19,36,28,.22))}

  display:flex;align-items:center;justify-content:center;animation:orbitar 8s linear infinite}

  from{transform:rotateZ(var(--a)) translateX(var(--r)) rotateZ(calc(-1 * var(--a))) rotateX(-72deg)}

.filtrao.pensando .filtrao-orbita i{animation-duration:2.2s}

    if (document.fonts && document.fonts.load) document.fonts.load('850 100px "Archivo"', "ilhão").then(function (f) { clearTimeout(limite); comecar(!!(f && f.length)); }, function () { clearTimeout(limite); comecar(false); });
    else { clearTimeout(limite); comecar(false); }
  });
  function sair() {
    if (fechado) return; fechado = true;
    el.classList.add("saindo");
    try { sessionStorage.setItem("milhao:abertura", "1"); } catch (e) {}
    setTimeout(function () { el.remove(); }, 450);
  }
  var pediu = false;
  function tentar() {
    if (fechado) return;
    if (inicio && Date.now() - inicio >= MIN) return sair();
    setTimeout(tentar, inicio ? Math.max(30, MIN - (Date.now() - inicio)) : 60);
  }
  window.__fecharAbertura = function () { if (!pediu) { pediu = true; tentar(); } };
  setTimeout(sair, 5000); // nunca prende a pessoa se algo demorar
})();
</script>

  if (vazio(v)) return "–";
  const a = Math.abs(v);
  const sinal = v < 0 ? "-R$ " : "R$ ";
  if (a >= 1e12) return sinal + F.n2.format(a / 1e12) + " tri";

/* ---------- dados ---------- */
async function j(url) {
  // versão de arquivo único: os dados vêm embutidos na própria página
  if (window.MILHAO_DADOS && url in window.MILHAO_DADOS) return structuredClone(window.MILHAO_DADOS[url]);

const precoAtual = (t) => S.porTicker[t]?.preco ?? null;

/* ---------- carteira: contas ---------- */
/* tipos de lançamento: C compra, V venda, B entrada sem compra (desdobro, bonificação),
   G saída sem venda (grupamento, fração) — B e G mexem na quantidade e mantêm o custo */
const ORDEM_TIPO = { B: 0, G: 1, C: 2, V: 3 };
const sinalQtd = (l) => (l.tipo === "C" || l.tipo === "B" ? 1 : -1);
const NOME_TIPO = { C: "Compra", V: "Venda", B: "Entrada de ações", G: "Saída de ações" };
const nomeLanc = (l) => l.evento || NOME_TIPO[l.tipo] || l.tipo;
function ordenados(c) {
  return [...c.lancamentos].sort((a, b) => a.data.localeCompare(b.data) || (ORDEM_TIPO[a.tipo] ?? 9) - (ORDEM_TIPO[b.tipo] ?? 9));
}
function posicoes(c) {
  const m = {};
  for (const l of ordenados(c)) {
    const p = m[l.ticker] ??= { ticker: l.ticker, qtd: 0, custo: 0, realizado: 0 };
    if (l.tipo === "C" || l.tipo === "B") { p.custo += l.qtd * (l.preco || 0); p.qtd += l.qtd; }
    else if (l.tipo === "G") { p.qtd = Math.max(p.qtd - l.qtd, 0); if (!p.qtd) p.custo = 0; }
    else {
      const pm = p.qtd ? p.custo / p.qtd : 0, q = Math.min(l.qtd, p.qtd);
      p.realizado += q * (l.preco - pm); p.custo -= q * pm; p.qtd -= q;
    }
  }
  return Object.values(m).map((p) => {
    p.qtd = Math.round(p.qtd * 1e6) / 1e6;
    const preco = precoAtual(p.ticker);
    const valor = preco !== null ? p.qtd * preco : null;
    return { ...p, pm: p.qtd ? p.custo / p.qtd : 0, preco, valor, resultado: valor !== null ? valor - p.custo : null };
  });
}
function qtdEm(c, t, data) {
  let q = 0;
  for (const l of c.lancamentos) if (l.ticker === t && l.data <= data) q += sinalQtd(l) * l.qtd;
  return Math.max(q, 0);
}
async function proventosDaCarteira(c) {
  const tickers = [...new Set(c.lancamentos.map((l) => l.ticker))].filter((t) => S.porTicker[t]);
  const primeira = ordenados(c)[0]?.data || hojeISO();
  const out = [];
  await Promise.all(tickers.map(async (t) => {
    let d; try { d = await detalhe(t); } catch (e) { return; }
    for (const p of d.proventos || []) {
      if (!p.data_com || p.data_com < primeira) continue;
      const q = qtdEm(c, t, p.data_com);
      if (q > 0) out.push({ ...p, ticker: t, qtd: q, total: q * p.valor,
        recebido: !!p.pagamento && p.pagamento <= hojeISO() });
    }
  }));
  return out.sort((a, b) => (b.pagamento || b.data_com).localeCompare(a.pagamento || a.data_com));
}
async function evolucao(c) {
  const lanc = ordenados(c);
  if (!lanc.length) return [];
  const tickers = [...new Set(lanc.map((l) => l.ticker))].filter((t) => S.porTicker[t]);
  const series = {};
  await Promise.all(tickers.map(async (t) => { try { series[t] = (await detalhe(t)).precos; } catch (e) { /* ignora */ } }));
  const ini = lanc[0].data;
  const datas = [...new Set(Object.values(series).flatMap((s) => s.map((p) => p[0])))].filter((d) => d >= ini).sort();
  const idx = Object.fromEntries(tickers.map((t) => [t, 0]));
  const ultimo = {};
  const out = datas.map((d) => {
    let total = 0, custo = 0;
    for (const t of tickers) {
      const s = series[t]; if (!s) continue;
      while (idx[t] < s.length && s[idx[t]][0] <= d) { ultimo[t] = s[idx[t]][1]; idx[t]++; }
      const q = qtdEm(c, t, d);
      if (q && ultimo[t]) total += q * ultimo[t];
    }
    for (const l of lanc) if (l.data <= d && (l.tipo === "C" || l.tipo === "V")) custo += (l.tipo === "C" ? 1 : -1) * l.qtd * l.preco;
    return { d, v: total, custo };
  });
  out.tickers = tickers.filter((t) => series[t]?.length);   // ativos com histórico de preço (os outros ficam fora da rentabilidade)
  out.inicio = Object.fromEntries(out.tickers.map((t) => [t, series[t][0][0]]));   // primeiro preço de cada ativo
  return out;
}

/* ---------- gráficos (SVG desenhado à mão) ---------- */
function graficoLinha(el, pontos, { altura = 280, cor = "var(--verde)", formato = brl, segunda = null, area = true, semDados = "Sem dados suficientes para o gráfico." } = {}) {
  el.innerHTML = "";
  if (pontos.length < 2) { el.innerHTML = `<p class="fraco">${semDados}</p>`; return; }
  const L = Math.max(el.clientWidth, 320), A = altura, m = { e: 8, d: 84, t: 12, b: 26 };
  const vals = pontos.map((p) => p.v).concat(segunda ? segunda.map((p) => p.v) : []);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min *= 0.95; max *= 1.05; }
  const pad = (max - min) * 0.08; const positivo = min >= 0; min -= pad; max += pad; if (positivo) min = Math.max(min, 0);
  const ts = pontos.map((p) => Date.parse(p.d)), t0 = ts[0], t1 = ts.at(-1) === t0 ? t0 + 1 : ts.at(-1);
  const X = (i) => m.e + ((ts[i] - t0) / (t1 - t0)) * (L - m.e - m.d);
  const maisPerto = (x) => {
    const alvo = t0 + ((x - m.e) / (L - m.e - m.d)) * (t1 - t0);
    let lo = 0, hi = ts.length - 1;
    while (hi - lo > 1) { const md = (lo + hi) >> 1; if (ts[md] < alvo) lo = md; else hi = md; }
    return Math.abs(ts[lo] - alvo) <= Math.abs(ts[hi] - alvo) ? lo : hi;
  };
  const Y = (v) => m.t + (1 - (v - min) / (max - min)) * (A - m.t - m.b);
  const caminho = (arr) => arr.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join("");
  const passo = (max - min) / 4;
  let grade = "";
  for (let k = 0; k <= 4; k++) {
    const v = min + passo * k, y = Y(v);
    grade += `<line x1="${m.e}" x2="${L - m.d}" y1="${y}" y2="${y}" stroke="var(--linha-2)"/>
      <text x="${L - m.d + 8}" y="${y + 4}" font-size="11.5" fill="var(--tinta-3)">${esc(formato(v))}</text>`;
  }
  const nMarcas = L < 420 ? 2 : L < 640 ? 3 : 4; // datas sem encavalar em tela pequena
  const marcas = [...Array(nMarcas).keys()].map((k) => maisPerto(m.e + (k / (nMarcas - 1)) * (L - m.e - m.d)));
  const eixo = marcas.map((i) => `<text x="${X(i)}" y="${A - 6}" font-size="11.5" fill="var(--tinta-3)" text-anchor="${i === 0 ? "start" : i === pontos.length - 1 ? "end" : "middle"}">${dataBR(pontos[i].d)}</text>`).join("");
  const pathA = caminho(pontos);
  el.innerHTML = `<svg viewBox="0 0 ${L} ${A}" height="${A}" role="img" aria-label="Gráfico">
    ${grade}${eixo}
    ${area ? `<path d="${pathA}L${X(pontos.length - 1)} ${A - m.b}L${X(0)} ${A - m.b}Z" fill="${cor}" opacity=".07"/>` : ""}
    ${segunda ? `<path d="${caminho(segunda)}" fill="none" stroke="var(--tinta-3)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ""}
    <path d="${pathA}" fill="none" stroke="${cor}" stroke-width="2"/>
    <line class="mira" y1="${m.t}" y2="${A - m.b}" stroke="var(--tinta-3)" stroke-width="1" opacity="0"/>
    <circle class="ponto" r="4" fill="${cor}" stroke="var(--branco)" stroke-width="2" opacity="0"/>
    <rect x="${m.e}" y="0" width="${L - m.e - m.d}" height="${A}" fill="transparent"/>
  </svg><div class="dica oculto"></div>`;
  const svg = $("svg", el), dica = $(".dica", el), mira = $(".mira", el), ponto = $(".ponto", el);
  svg.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (L / r.width);
    const i = maisPerto(x);
    const p = pontos[i];
    mira.setAttribute("x1", X(i)); mira.setAttribute("x2", X(i)); mira.setAttribute("opacity", 1);
    ponto.setAttribute("cx", X(i)); ponto.setAttribute("cy", Y(p.v)); ponto.setAttribute("opacity", 1);
    dica.innerHTML = `${dataBR(p.d)}  <b>${esc(formato(p.v))}</b>` + (segunda ? ` <span style="opacity:.7">investido ${esc(formato(segunda[i].v))}</span>` : "");
    dica.style.left = (X(i) * r.width / L) + "px"; dica.style.top = (Y(p.v) * r.height / A) + "px";
    dica.classList.remove("oculto");
  });
  svg.addEventListener("mouseleave", () => { dica.classList.add("oculto"); mira.setAttribute("opacity", 0); ponto.setAttribute("opacity", 0); });
}
function graficoBarras(el, itens, { altura = 200, cor = "var(--ouro)", formato = brl } = {}) {
  el.innerHTML = "";
  if (!itens.length) { el.innerHTML = `<p class="fraco">Sem proventos no período.</p>`; return; }

  el.innerHTML = `<svg viewBox="0 0 ${L} ${A}" height="${A}" role="img" aria-label="Proventos por ano">` + itens.map((it, k) => {

/* ---------- gráfico de candles (canvas desenhado à mão) ---------- */
function agruparVelas(d, tempo) {

/* ---------- roteador ---------- */
const rotas = {};
function ir(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", () => render());

function render() {
  // a preferência salva na conta vale em qualquer aparelho
  if (S.estado?.tema && (S.estado.tema === "escuro") !== temaEscuro()) aplicarTema(S.estado.tema);
  montarFiltrao(); document.body.classList.toggle("com-filtrao", !!S.estado.perfil);   // o Filtrão só aparece para quem entrou
  const h = location.hash.replace(/^#\/?/, "") || "";
  const rota = h.split("-")[0], args = h.includes("-") ? [h.slice(rota.length + 1)] : [];
  document.documentElement.classList.toggle("plano-ouro", !!S.estado.perfil && ehOuro());   // Milhão Ouro: logo dourada
  if (rota === "termos" || rota === "privacidade") { document.body.classList.remove("com-filtrao"); return telaDocumento(rota); }
  if (!S.estado.perfil) return telaEntrada();
  if (!rota || rota === "carteiras" || !carteira() && rota === "carteira") return telaCarteiras();
  if (rota !== "reclame") S.rotaAnterior = h || rota;
  moldura(rota);
  const alvo = $("#conteudo");
  (rotas[rota] || rotas.carteira)(alvo, ...args.map(decodeURIComponent));
  window.scrollTo(0, 0);
}

function velasEntrada() {

  const topo = Math.max(...velas.map((v) => v.max)), base = Math.min(...velas.map((v) => v.min));
  const Y = (v) => 6 + (topo - v) / (topo - base) * 188, L = 1000 / velas.length;
  return `<svg class="velas" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${velas.map((v, i) => {
    const sobe = v.fecha >= v.abre, cor = sobe ? "#2FCB8F" : "#E46A55", x = i * L + L / 2;
    const y1 = Y(Math.max(v.abre, v.fecha)), y2 = Y(Math.min(v.abre, v.fecha));
    return `<g class="vela" style="--i:${i}" fill="${cor}" stroke="${cor}">
      <line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(v.max).toFixed(1)}" y2="${Y(v.min).toFixed(1)}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <rect x="${(x - L * 0.32).toFixed(1)}" y="${y1.toFixed(1)}" width="${(L * 0.64).toFixed(1)}" height="${Math.max(y2 - y1, 1.5).toFixed(1)}" rx="1.5" ${sobe ? "" : 'fill-opacity=".85"'}/></g>`;
  }).join("")}</svg>`;
}

/* lupa: ao passar o cursor, um círculo amplia o pedaço da marca que está embaixo dele */
function ligarLupa() {
  const area = $("#lupa-area"), lupa = $("#lupa");
  if (!area || !lupa || area.dataset.ligada) return;
  area.dataset.ligada = "1";
  const ZOOM = 2.2, conteudo = lupa.firstElementChild;
  const mover = (e) => {
    const r = area.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, R = lupa.offsetWidth / 2;
    lupa.style.transform = `translate(${x - R}px, ${y - R}px)`;
    conteudo.style.transform = `translate(${R - x * ZOOM}px, ${R - y * ZOOM}px) scale(${ZOOM})`;
  };
  area.addEventListener("pointerenter", (e) => { mover(e); area.classList.add("com-lupa"); });
  area.addEventListener("pointermove", mover);
  area.addEventListener("pointerleave", () => area.classList.remove("com-lupa"));

        ${modo === "entrar" ? `<a href="#" data-modo="esqueci" class="esqueci">Esqueci minha senha</a>` : ""}

  if (ja) $("#entrada-form").innerHTML = formulario;
  else $("#raiz").innerHTML = `<main class="entrada">${arteEntrada()}<section class="entrada-form" id="entrada-form">${formulario}</section></main>`;

  const form = $("#form-login"), botao = form.querySelector("button[type=submit]");
  const erro = (msg) => { const el = $("#erro-login"); el.textContent = msg; el.classList.toggle("oculto", !msg); };
  form.querySelector("input")?.focus();
  form.addEventListener("submit", async (e) => {

    if (modo === "criar" && !String(f.get("nome") || "").trim()) return erro("Conte como você quer ser chamado.");

    botao.disabled = true; const rotulo = botao.textContent; botao.textContent = "Aguarde…";

      if (modo === "esqueci") r = await a.resetPasswordForEmail(email, { redirectTo: SITE });
      if (modo === "nova") r = await a.updateUser({ password: senha });

/* ---------- renomear carteira ---------- */
async function renomearCarteira(id) {
  const c = S.estado.carteiras.find((x) => x.id === id);
  if (!c) return false;
  const nome = await perguntar({ titulo: "Renomear carteira", rotulo: "Nome da carteira", valor: c.nome, botao: "Salvar nome" });
  if (!nome || nome.slice(0, 40) === c.nome) return false;
  c.nome = nome.slice(0, 40); salvar(); aviso(`Carteira renomeada para "${c.nome}"`);
  return true;
}

/* ---------- excluir carteira (com confirmação e "Desfazer") ---------- */
async function excluirCarteira(id) {
  const lista = S.estado.carteiras, i = lista.findIndex((c) => c.id === id);
  if (i < 0) return false;
  const c = lista[i], n = c.lancamentos.length;
  const ok = await perguntar({
    titulo: `Excluir a carteira "${c.nome}"?`,
    texto: n ? `${plural(n, "lançamento vai junto", "lançamentos vão junto")} com ela. Se foi sem querer, dá para desfazer logo depois.` : "Ela ainda está vazia.",
    botao: "Excluir carteira", perigo: true,
  });
  if (!ok) return false;
  const eraAtiva = S.estado.ativa === id;
  lista.splice(i, 1);
  if (eraAtiva) S.estado.ativa = null;
  salvar();
  aviso(`Carteira "${c.nome}" excluída`, { rotulo: "Desfazer", fn: () => {
    S.estado.carteiras.splice(Math.min(i, S.estado.carteiras.length), 0, c);
    if (eraAtiva) S.estado.ativa = c.id;
    salvar(); aviso(`Carteira "${c.nome}" de volta`); render();
  } });
  return true;
}

/* ---------- gráfico de pizza: onde está o dinheiro ---------- */
const PALETA_ALOC = ["#0F8A62", "#C9971C", "#2F6FB3", "#C2453D", "#7B57B8", "#1CA39A", "#D97A2B", "#5B8C2A", "#B3458F"];
let alocModo = "ativo";
const valorAloc = (v, total) => total >= 100000 ? compacto(v) : brl(v);
const centroAloc = (v) => v >= 10000 ? compacto(v) : brl(v);
function arcoDonut(c, rO, rI, a0, a1, gap) {
  if (gap && a1 - a0 > gap * 2.5) { a0 += gap; a1 -= gap; }
  const p = (r, a) => [(c + r * Math.cos(a)).toFixed(2), (c + r * Math.sin(a)).toFixed(2)];
  const laf = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = p(rO, a0), [x1, y1] = p(rO, a1), [x2, y2] = p(rI, a1), [x3, y3] = p(rI, a0);
  return `M${x0} ${y0}A${rO} ${rO} 0 ${laf} 1 ${x1} ${y1}L${x2} ${y2}A${rI} ${rI} 0 ${laf} 0 ${x3} ${y3}Z`;
}
// soma o valor de hoje de todas as posições de todas as carteiras, por ativo ou por classe
function dadosAlocacao(modo) {
  const soma = {};
  for (const c of S.estado.carteiras) for (const p of posicoes(c)) {
    if (!(p.qtd > 0) || !p.valor) continue;
    const a = S.porTicker[p.ticker];
    const k = modo === "classe" ? (a?.tipo || "acao") : p.ticker;
    soma[k] = (soma[k] || 0) + p.valor;
  }
  let arr = Object.entries(soma).map(([k, v]) => ({ k, v })).sort((x, y) => y.v - x.v);
  const total = arr.reduce((s, x) => s + x.v, 0);
  if (modo !== "classe" && arr.length > 8) {  // muitos ativos: mostra os 7 maiores e junta o resto
    const resto = arr.slice(7).reduce((s, x) => s + x.v, 0);
    arr = [...arr.slice(0, 7), { k: "__outros", v: resto, outros: true }];
  }
  return { arr, total };
}
function donutSVG(itens, total) {
  const S = 170, c = S / 2, rO = 78, rI = 50; let a = -Math.PI / 2; const seg = [];
  const attr = (it) => it.t ? `data-aloc-t="${it.t}"` : it.classe ? `data-aloc-classe="${it.classe}"` : "";
  if (itens.length === 1) {
    const it = itens[0];
    seg.push(`<circle cx="${c}" cy="${c}" r="${(rO + rI) / 2}" fill="none" stroke="${it.cor}" stroke-width="${rO - rI}" ${attr(it)} data-i="0" class="aloc-fatia"/>`);
  } else {
    itens.forEach((it, i) => { const a1 = a + (it.v / total) * 2 * Math.PI;
      seg.push(`<path d="${arcoDonut(c, rO, rI, a, a1, 0.018)}" fill="${it.cor}" ${attr(it)} data-i="${i}" class="aloc-fatia"/>`); a = a1; });
  }
  return `<div class="aloc-grafico"><svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Onde está o dinheiro">${seg.join("")}
    <text x="${c}" y="${c - 17}" text-anchor="middle" class="aloc-centro-topo" id="aloc-c1">Total</text>
    <text x="${c}" y="${c + 5}" text-anchor="middle" class="aloc-centro" id="aloc-c2">${esc(centroAloc(total))}</text>
    <text x="${c}" y="${c + 22}" text-anchor="middle" class="aloc-centro-sub" id="aloc-c3">investido</text></svg></div>`;
}
function blocoAlocacao() {
  const temAlgo = S.estado.carteiras.some((c) => posicoes(c).some((p) => p.qtd > 0 && p.valor));
  return `<aside class="painel aloc">
    <h2 style="margin:0 0 4px;font-size:17px">Onde está o dinheiro</h2>
    <p class="sutil" style="margin:0 0 14px">${temAlgo ? "Somando todas as suas carteiras. Clique para abrir." : "A divisão dos seus investimentos aparece aqui."}</p>
    ${temAlgo ? `<div class="chips aloc-chips">
        <button class="chip" data-aloc="ativo" aria-pressed="${alocModo === "ativo"}">Por ativo</button>
        <button class="chip" data-aloc="classe" aria-pressed="${alocModo === "classe"}">Por classe</button></div>
      <div id="aloc-corpo"></div>`
    : `<p class="fraco" style="margin:0">Quando você tiver ativos nas carteiras, mostramos aqui quanto do seu dinheiro está em cada ativo e em cada classe (ações, FIIs, ETFs e mais).</p>`}
  </aside>`;
}
// legenda clicável da rosca; "attr" diz o que cada item faz ao clicar
function legendaRosca(itens, total, attr) {
  return `<ul class="aloc-leg">${itens.map((it, i) => `<li><button class="aloc-item" data-i="${i}" ${attr(it)}>
      <i style="background:${it.cor}"></i>
      <span class="aloc-nome"><b>${esc(it.rotulo)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</span>
      <span class="aloc-val"><b>${pct(it.v / total, 1)}</b><em>${esc(valorAloc(it.v, total))}</em></span>
      <span class="aloc-barra"><span style="width:${(it.v / itens[0].v * 100).toFixed(1)}%;background:${it.cor}"></span></span></button></li>`).join("")}</ul>`;
}
// passar o mouse numa fatia ou num item realça os dois e mostra o item no centro
function ligarRosca(el, itens, total) {
  const caixa = $(".aloc-grafico", el), c1 = $("#aloc-c1", el), c2 = $("#aloc-c2", el), c3 = $("#aloc-c3", el);
  // o texto do centro nunca passa da largura do furo da rosca
  const caber = () => [[c1, 10.5, 70], [c2, 20, 88], [c3, 11, 80]].forEach(([t, base, max]) => {
    t.style.fontSize = base + "px";
    const w = t.getComputedTextLength();
    if (w > max) t.style.fontSize = (base * max / w).toFixed(1) + "px";
  });
  const realcar = (i) => {
    caixa.classList.toggle("aloc-foco", i != null);
    $$(".aloc-fatia", el).forEach((f) => f.classList.toggle("on", f.dataset.i === String(i)));
    $$(".aloc-item", el).forEach((b) => b.classList.toggle("on", b.dataset.i === String(i)));
    const it = itens[i];
    c1.textContent = it ? (it.rotulo.length > 14 ? it.rotulo.slice(0, 13) + "…" : it.rotulo) : "Total";
    c2.textContent = it ? pct(it.v / total, 1) : centroAloc(total);
    c3.textContent = it ? centroAloc(it.v) : "investido";
    caber();
  };
  caber();
  $$(".aloc-fatia, .aloc-item", el).forEach((n) => {
    n.addEventListener("mouseenter", () => realcar(+n.dataset.i));
    n.addEventListener("mouseleave", () => realcar(null));
    n.addEventListener("focus", () => realcar(+n.dataset.i));
    n.addEventListener("blur", () => realcar(null));
  });
}
function pintarAlocacao() {
  const el = $("#aloc-corpo"); if (!el) return;
  const { arr, total } = dadosAlocacao(alocModo);
  if (!total) { el.innerHTML = `<p class="fraco">Sem valor para mostrar.</p>`; return; }
  const itens = arr.map((x, i) => ({
    v: x.v, cor: x.outros ? "#9AA3AB" : PALETA_ALOC[i % PALETA_ALOC.length],
    rotulo: x.outros ? "Outros" : alocModo === "classe" ? classe(x.k).aba : x.k,
    sub: x.outros || alocModo === "classe" ? "" : (S.porTicker[x.k]?.n || ""),
    t: !x.outros && alocModo !== "classe" ? x.k : null,
    classe: alocModo === "classe" && !x.outros ? x.k : null,
  }));
  el.innerHTML = `${donutSVG(itens, total)}${legendaRosca(itens, total, (it) => it.t ? `data-aloc-t="${it.t}" title="Abrir ${esc(it.t)}"` : it.classe ? `data-aloc-classe="${it.classe}" title="Ver ${esc(it.rotulo)} nos rankings"` : "disabled")}`;
  ligarRosca(el, itens, total);
  $$("[data-aloc-t]", el).forEach((b) => b.onclick = () => ir("#ativo-" + b.dataset.alocT));
  $$("[data-aloc-classe]", el).forEach((b) => b.onclick = () => { UI.tipo = b.dataset.alocClasse; UI.preset = 0; UI.ordem = null; ir("#explorar"); });
}

            <span><small>Yield</small><b>${pct(r.yield, 1)}</b></span><span><small>Ativos</small><b>${r.pos.length}</b></span></span>`
          : `<span class="sutil">Ainda sem ativos. Abra para importar da B3 ou lançar compras.</span>`}</button>
          <button class="renomear-carteira" data-renomear="${c.id}" aria-label="Renomear a carteira ${esc(c.nome)}" title="Renomear carteira">${ICO.lapis}</button>
          <button class="excluir-carteira" data-excluir="${c.id}" aria-label="Excluir a carteira ${esc(c.nome)}" title="Excluir carteira">${ICO.lixo}</button></div>`; }).join("")}
      <button class="nova" id="nova-carteira">Criar carteira</button>
    </div>
    ${blocoAlocacao()}
    </div>
    ${blocoRumo()}
    ${S.ativos.length ? blocoMercado() : ""}</main>${rodapeSite()}`;
  // mini gráfico da evolução de cada carteira nos últimos 3 meses
  for (const c of cs) {
    if (!c.lancamentos.length) continue;
    evolucao(c).then((ev) => {
      const corte = new Date(Date.now() - 92 * 864e5).toISOString().slice(0, 10);
      const el = $(`[data-spark="${c.id}"]`); if (el) el.innerHTML = miniGrafico(ev.filter((p) => p.d >= corte && p.v > 0));
    }).catch(() => {});
  }
  $$(".lista-carteiras button[data-id]").forEach((b) => b.onclick = () => { S.estado.ativa = b.dataset.id; salvar(); ir("#carteira"); });
  $$("[data-excluir]").forEach((b) => b.onclick = async () => { if (await excluirCarteira(b.dataset.excluir)) telaCarteiras(); });
  $$("[data-renomear]").forEach((b) => b.onclick = async () => { if (await renomearCarteira(b.dataset.renomear)) telaCarteiras(); });
  const criarCarteira = async () => {
    if (!ehOuro() && cs.length >= LIMITES_GRATIS.carteiras) { pedirOuro("carteiras"); return false; }
    const nome = await perguntar({ titulo: "Criar carteira", rotulo: "Nome da carteira", botao: "Criar carteira",
      valor: cs.length ? "Carteira " + (cs.length + 1) : "Minha carteira" });
    if (!nome) return false;
    const c = { id: novoId(), nome: nome.trim(), lancamentos: [], criada: hojeISO() };
    S.estado.carteiras.push(c); S.estado.ativa = c.id; salvar(); return true;
  };
  $("#nova-carteira").onclick = async () => { if (await criarCarteira()) ir("#carteira"); };
  // serviços da barra: os que dependem de uma carteira usam a última aberta (ou a primeira)
  $$("[data-servico]").forEach((a) => a.onclick = async (e) => {
    const r = a.dataset.servico;
    if (!["carteira", "proventos", "importar", "analise"].includes(r)) return;
    e.preventDefault();
    if (!carteira()) {
      if (cs.length) { S.estado.ativa = cs[0].id; salvar(); }
      else if (r !== "analise" && !(await criarCarteira())) return;
    }
    if (r === "importar") { ir("#carteira"); setTimeout(abrirImportacao, 0); }
    else ir("#" + r);
  });
  ligarBusca(); ligarBotaoTema();
  pintarAlocacao();
  $$("[data-aloc]").forEach((b) => b.onclick = () => { alocModo = b.dataset.aloc; $$("[data-aloc]").forEach((x) => x.setAttribute("aria-pressed", x === b)); pintarAlocacao(); });
  $("#sair").onclick = async () => {
    if (S.nuvem && S.usuario) {
      if (await perguntar({ titulo: "Sair da sua conta?", texto: "Suas carteiras continuam salvas na conta. É só entrar de novo.", botao: "Sair" })) sairDaConta();
      return;
    }
    if (await perguntar({ titulo: "Sair do Milhão?", texto: "Suas carteiras continuam salvas neste navegador.", botao: "Sair" })) {
      S.estado.perfil = null; salvar(); ir("#entrada"); }
  };
}

function ligarBusca() {
  const inp = $("#busca"), box = $("#sugestoes");
  let sel = 0, res = [];
  const mostrar = () => {
    const q = inp.value.trim().toUpperCase();
    if (!q) { box.classList.add("oculto"); return; }
    res = S.ativos.filter((a) => a.t.startsWith(q)).concat(S.ativos.filter((a) => !a.t.startsWith(q) && (a.t.includes(q) || (a.n || "").toUpperCase().includes(q)))).slice(0, 8);
    sel = 0;
    box.innerHTML = res.length ? res.map((a, i) => `<button role="option" class="${i === sel ? "sel" : ""}" data-t="${a.t}"><b>${a.t}</b><span>${esc(a.n)}</span><span class="fraco" style="margin-left:auto">${brl(a.preco)}</span></button>`).join("")
      : `<div class="vazio" style="padding:14px">Nenhum ativo com “${esc(inp.value)}”.</div>`;
    box.classList.remove("oculto");
    $$("button", box).forEach((b) => b.onmousedown = (e) => { e.preventDefault(); ir("#ativo-" + b.dataset.t); });
  };
  inp.addEventListener("input", mostrar);
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + res.length) % Math.max(res.length, 1);
      $$("button", box).forEach((b, i) => b.classList.toggle("sel", i === sel));
    } else if (e.key === "Enter" && res[sel]) ir("#ativo-" + res[sel].t);
    else if (e.key === "Escape") box.classList.add("oculto");
  });
  inp.addEventListener("blur", () => setTimeout(() => box.classList.add("oculto"), 120));
}

  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { const b = $("#busca"); if (b) { e.preventDefault(); b.focus(); } }
});

/* ---------- lançamento ---------- */
function abrirLancamento(ticker = "") {
  const dlg = $("#dlg-lancamento"), f = $("#form-lancamento");
  f.reset(); $("#lanc-erro").textContent = "";
  f.ticker.value = ticker; f.data.value = hojeISO();
  if (ticker && precoAtual(ticker)) f.preco.value = precoAtual(ticker).toFixed(2);
  f.ticker.oninput = () => { const t = f.ticker.value.trim().toUpperCase(); if (precoAtual(t) && !f.preco.value) f.preco.value = precoAtual(t).toFixed(2); };
  dlg.showModal();
  dlg.onclose = () => {
    if (dlg.returnValue !== "salvar") return;
    const c = carteira();
    const l = { id: novoId(), ticker: f.ticker.value.trim().toUpperCase(), tipo: f.tipo.value, data: f.data.value,
      qtd: Math.round(+f.qtd.value), preco: +f.preco.value };
    if (l.tipo === "V" && qtdEm(c, l.ticker, l.data) < l.qtd) { aviso(`Venda maior que a posição de ${l.ticker} nessa data`); return; }
    c.lancamentos.push(l); salvar();
    aviso(`${l.tipo === "C" ? "Compra" : "Venda"} de ${l.ticker} lançada`);
    if (location.hash === "#carteira") render(); else ir("#carteira");
  };
}

/* ---------- importação: planilhas da Área do Investidor da B3 (.xlsx) ou CSV ---------- */
async function lerZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("o arquivo não é uma planilha .xlsx");
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);

    const sai = new Set([...(trocar ? movTrocavel : []), ...ajAntigos.filter((l) => !fora.has(l.ticker))].map((l) => l.id));
    const base = [...c.lancamentos.filter((l) => !sai.has(l.id)), ...novos.filter((l) => !fora.has(l.ticker)),

    if (!temPosicao) return { lanc: base, ajustes: [] };
    const sim = Object.fromEntries(posicoes({ lancamentos: base }).map((p) => [p.ticker, p]));
    const tickers = new Set([...Object.keys(naB3), ...Object.keys(sim).filter((t) => sim[t].qtd > 0)]);
    const ajustes = [...tickers].filter((t) => !fora.has(t)).map((t) => ({ ticker: t, de: sim[t]?.qtd || 0, para: naB3[t]?.qtd || 0 }))
      .filter((a) => Math.abs(a.para - a.de) > 1e-6).sort((a, b) => a.ticker.localeCompare(b.ticker));
    if (!ajustar) return { lanc: base, ajustes };
    return { ajustes, lanc: [...base, ...ajustes.map((a) => lancAjuste(a.ticker, a.de, a.para, sim[a.ticker]?.pm || 0, hoje))] };
  };
  const ajustes0 = montar(new Set(), true, true).ajustes;
  const listaTexto = (xs) => xs.length > 1 ? xs.slice(0, -1).join(", ") + " e " + xs.at(-1) : xs[0] || "";
  const partes = (() => {
    const conta = (f) => novos.filter(f).length;
    const nAt = conta((l) => l.evento === "Atualização na B3"), nC = conta((l) => l.tipo === "C") - nAt;
    const nV = conta((l) => l.tipo === "V"), nE = conta((l) => l.tipo === "B" || l.tipo === "G");
    return [nC && plural(nC, "compra", "compras"), nV && plural(nV, "venda", "vendas"),
      nE && plural(nE, "desdobramento, bonificação ou grupamento", "desdobramentos, bonificações ou grupamentos"),
      nAt && plural(nAt, "entrada por atualização", "entradas por atualização"),
      posNovas.length && plural(posNovas.length, "ativo que só aparece na posição", "ativos que só aparecem na posição")].filter(Boolean);
  })();
  const fora = [];
  if (repetidos > 0) fora.push(["Repetidos (já na carteira ou em mais de um arquivo)", repetidos]);
  if (pulados) fora.push(["Compras e vendas da Movimentação que já vêm da Negociação", pulados]);
  if (tudo.proventos) fora.push(["Proventos (o Milhão calcula pelos dados da B3)", tudo.proventos]);
  if (tudo.foraBolsa) fora.push(["Tesouro, renda fixa, opções e outros que o Milhão não acompanha", tudo.foraBolsa]);
  for (const [k, v] of Object.entries(tudo.outros)) fora.push([k, v]);
  const naoLidos = tudo.arquivos.filter((a) => !a.usou).map((a) => a.nome);
  const semCot = [...new Set([...novos.map((l) => l.ticker), ...posNovas.map((p) => p.ticker)])].filter((t) => !S.porTicker[t]);
  const total = novos.length + posNovas.length + ajustes0.length;
  // o que muda em cada ativo, em uma linha
  const porAtivo = new Map();
  const somar = (t, k, n = 1) => { const a = porAtivo.get(t) ?? {}; a[k] = (a[k] || 0) + n; porAtivo.set(t, a); };
  for (const l of novos) somar(l.ticker, l.evento === "Atualização na B3" ? "at" : l.tipo === "C" ? "c" : l.tipo === "V" ? "v" : "e");
  for (const p of posNovas) somar(p.ticker, "pos");
  const descAtivo = (a) => [a.c && plural(a.c, "compra", "compras"), a.v && plural(a.v, "venda", "vendas"),
    a.e && plural(a.e, "evento", "eventos"), a.at && plural(a.at, "entrada", "entradas"), a.pos && "da posição de hoje"].filter(Boolean).join(", ");
  const linhasTk = [...new Set([...porAtivo.keys(), ...ajustes0.map((a) => a.ticker)])].sort();
  const excluidos = new Set();

  $("#imp-titulo").textContent = total ? `Importar para ${c.nome}` : "Nada novo para importar";
  $("#imp-corpo").innerHTML = `

    ${linhasTk.length ? `<div class="imp-cabeca"><h3>Como a carteira vai ficar</h3>${linhasTk.length > 1 ? `<button type="button" class="btn texto" id="imp-todos" style="padding:2px 4px">Desmarcar todos</button>` : ""}</div>
      <p class="fraco" style="margin:0">Confira com a sua corretora. Desmarque o ativo que você não quer trazer.</p>
      <div class="imp-tabela imp-final-caixa"><table class="imp-final"><thead><tr><th></th><th class="esq">Ativo</th><th>Quantidade</th><th>Preço médio</th>${temPosicao ? "<th>Posição na B3</th>" : ""}</tr></thead>
      <tbody id="imp-final"></tbody></table></div>` : ""}
    ${!total ? `<p class="imp-nota">${repetidos > 0 ? "Tudo o que dá para importar dessa planilha já está na carteira."
        : tudo.tipos.has("movimentacao") && !tudo.tipos.has("negociacao") && !tudo.tipos.has("posicao")
        ? "A planilha de Movimentação só mostra o que aconteceu no período que você escolheu na B3, e nesse período não houve compra nem venda. Baixe de novo com o período desde a sua primeira compra, ou mande a planilha de <b>Posição</b> (o retrato de hoje)."
        : "Nada nessa planilha é compra, venda ou ativo que a carteira ainda não tenha. Confira o período escolhido na B3 ou mande a planilha de <b>Posição</b>, que traz o que você tem hoje."}</p>` : ""}
    ${semPreco.length ? `<p class="imp-nota">A B3 não informa o preço destas entradas. Sugerimos o fechamento do dia; se você pagou outro valor (numa subscrição, por exemplo), troque aqui.</p>
      <div class="imp-tabela"><table><thead><tr><th>Ativo</th><th>Data</th><th>Quantidade</th><th>Preço (R$)</th></tr></thead><tbody>
      ${semPreco.map((l, k) => `<tr data-linha-tk="${esc(l.ticker)}"><td><b>${esc(l.ticker)}</b></td><td>${dataBR(l.data)}</td><td>${F.n0.format(l.qtd)}</td>
        <td><input type="number" step="0.01" min="0" data-sp="${k}" value="${(+l.preco || 0).toFixed(2)}" aria-label="Preço de ${esc(l.ticker)} em ${dataBR(l.data)}"></td></tr>`).join("")}
      </tbody></table></div>` : ""}
    ${posNovas.length ? `<p class="imp-nota">Estes ativos só aparecem na planilha de Posição, que não traz o preço que você pagou. Coloque o preço médio de cada um (veja na sua corretora). Se deixar como está, o Milhão usa a cotação da planilha e o ativo começa sem ganho nem perda.</p>
      <div class="imp-tabela"><table><thead><tr><th>Ativo</th><th>Quantidade</th><th>Preço médio (R$)</th></tr></thead><tbody>
      ${posNovas.map((p, k) => `<tr data-linha-tk="${esc(p.ticker)}"><td><b>${esc(p.ticker)}</b></td><td>${F.n0.format(p.qtd)}</td>
        <td><input type="number" step="0.01" min="0" data-pm="${k}" value="${(+p.preco || 0).toFixed(2)}" aria-label="Preço médio de ${esc(p.ticker)}"></td></tr>`).join("")}
      </tbody></table></div>` : ""}
    ${movTrocavel.length && tudo.tipos.has("negociacao") ? `<label class="imp-check"><input type="checkbox" id="imp-trocar" checked>
      <span>Trocar as ${plural(movTrocavel.length, "compra ou venda", "compras e vendas")} que vieram da Movimentação pelas da Negociação, que têm a data do pregão. Assim nada fica em dobro.</span></label>` : ""}
    ${ajustes0.length ? `<label class="imp-check"><input type="checkbox" id="imp-ajustar" checked><span>Igualar as quantidades às da B3. A diferença quase sempre é desdobramento, bonificação ou grupamento: o que falta entra sem custo e o que sobra sai sem mudar o valor investido.</span></label>
      <p class="fraco" style="margin:-8px 0 0 25px">Se a diferença for uma compra ou venda de antes do período baixado, desmarque e importe a Movimentação desse período.</p>` : ""}
    ${!temPosicao ? `<p class="imp-nota">Mande junto a planilha de <b>Posição</b> de hoje. Sem ela, uma venda ou evento fora do período baixado deixa a quantidade antiga na carteira. Com ela, o Milhão confere cada ativo e iguala as quantidades às da B3.</p>` : ""}
    ${fora.length ? `<details class="imp-fora"><summary>Fica de fora: ${plural(fora.reduce((s, [, v]) => s + v, 0), "linha", "linhas")}</summary>
      <ul class="imp-resumo">${fora.map(([k, v]) => `<li class="fora"><span>${esc(k)}</span><span>${F.n0.format(v)}</span></li>`).join("")}</ul></details>` : ""}
    ${semCot.length ? `<p class="fraco" style="margin:0">Sem cotação na base do Milhão: ${esc(semCot.slice(0, 8).join(", "))}${semCot.length > 8 ? "…" : ""}. Eles entram na carteira, mas sem valor atual.</p>` : ""}`;
  $("#imp-ok").textContent = total ? "Importar" : "Escolher outra planilha";
  $("#imp-ok").disabled = false;
  // redesenha a tabela final a cada mudança (ativo marcado, preço digitado, igualar ou trocar)
  const pintar = () => {
    $$("[data-sp]").forEach((inp) => { const v = numeroBR(inp.value); if (Number.isFinite(v) && v >= 0) semPreco[+inp.dataset.sp].preco = v; });
    $$("[data-pm]").forEach((inp) => { const v = numeroBR(inp.value); posNovas[+inp.dataset.pm].pm = Number.isFinite(v) && v >= 0 ? v : null; });
    const trocar = $("#imp-trocar")?.checked ?? false, ajustar = $("#imp-ajustar")?.checked ?? false;
    const { lanc, ajustes } = montar(excluidos, trocar, ajustar);
    const fim = Object.fromEntries(posicoes({ lancamentos: lanc }).map((p) => [p.ticker, p]));
    const aj = Object.fromEntries(ajustes.map((a) => [a.ticker, a]));
    const corpo = $("#imp-final");
    if (corpo) {
      corpo.innerHTML = linhasTk.map((t) => {
        const sai = excluidos.has(t), p = fim[t], b3 = naB3[t]?.qtd ?? 0;
        const st = sai ? "–" : aj[t] && ajustar ? `<span class="imp-aj">igualada (era ${qtdF(aj[t].de)})</span>`
          : Math.abs((p?.qtd || 0) - b3) < 1e-6 ? `<span class="alta">confere</span>` : `<span class="imp-dif">${qtdF(b3)} na B3</span>`;
        return `<tr class="${sai ? "excluido" : ""}"><td><input type="checkbox" data-ativo="${esc(t)}" ${sai ? "" : "checked"} aria-label="Trazer ${esc(t)}"></td>
          <td class="esq"><b>${esc(t)}</b><small>${porAtivo.has(t) ? descAtivo(porAtivo.get(t)) : "só a diferença para a B3"}</small></td>
          <td>${sai ? "–" : qtdF(p?.qtd || 0)}</td><td>${sai || !(p?.qtd > 0) ? "–" : brl(p.pm)}</td>${temPosicao ? `<td>${st}</td>` : ""}</tr>`;
      }).join("");
      $$("[data-ativo]", corpo).forEach((cx) => cx.onchange = () => { cx.checked ? excluidos.delete(cx.dataset.ativo) : excluidos.add(cx.dataset.ativo); pintar(); });
    }
    $$("[data-linha-tk]").forEach((tr) => tr.classList.toggle("excluido", excluidos.has(tr.dataset.linhaTk)));
    const n = linhasTk.filter((t) => !excluidos.has(t)).length;
    if (total) { $("#imp-ok").textContent = n ? `Importar ${plural(n, "ativo", "ativos")}` : "Importar"; $("#imp-ok").disabled = !n; }
    if ($("#imp-todos")) $("#imp-todos").textContent = excluidos.size === linhasTk.length ? "Marcar todos" : "Desmarcar todos";
  };
  $$("[data-sp], [data-pm]").forEach((inp) => inp.oninput = pintar);
  if ($("#imp-ajustar")) $("#imp-ajustar").onchange = pintar;
  if ($("#imp-trocar")) $("#imp-trocar").onchange = pintar;
  if ($("#imp-todos")) $("#imp-todos").onclick = () => {
    const marcar = excluidos.size === linhasTk.length;
    for (const t of linhasTk) marcar ? excluidos.delete(t) : excluidos.add(t);
    pintar();
  };
  pintar();
  dlg.returnValue = ""; if (!dlg.open) dlg.showModal();
  dlg.onclose = () => {
    $("#imp-ok").disabled = false;
    if (dlg.returnValue === "ok" && !total) { $("#arquivo-importar").click(); return; }
    const nAtivos = linhasTk.filter((t) => !excluidos.has(t)).length;
    if (dlg.returnValue !== "ok" || !total || !nAtivos) return;
    pintar();   // lê os preços digitados
    const trocar = $("#imp-trocar")?.checked ?? false, ajustar = $("#imp-ajustar")?.checked ?? false;
    const ajustes = ajustar ? montar(excluidos, trocar, false).ajustes : [];   // calculado antes de mexer nas listas
    for (const l of novos) delete l.semPreco;
    const entram = novos.filter((l) => !excluidos.has(l.ticker));
    const sai = new Set([...(trocar ? movTrocavel : []), ...ajAntigos].filter((l) => !excluidos.has(l.ticker)).map((l) => l.id));
    c.lancamentos = c.lancamentos.filter((l) => !sai.has(l.id));
    for (const p of posNovas) if (!excluidos.has(p.ticker))
      entram.push({ id: novoId(), ticker: p.ticker, tipo: "C", data: hoje, qtd: p.qtd, preco: p.pm ?? p.preco, origem: "b3-posicao", evento: "Posição na B3" });
    c.lancamentos.push(...entram);
    // igualar à B3: entra sem custo ou sai sem mudar o valor investido (como desdobramento, bonificação e grupamento)
    let nAj = 0;
    if (ajustes.length) {
      const agora = Object.fromEntries(posicoes(c).map((p) => [p.ticker, p]));
      for (const a of ajustes) {
        const de = agora[a.ticker]?.qtd || 0, d = Math.round((a.para - de) * 1e6) / 1e6;
        if (!d) continue;
        c.lancamentos.push({ ...lancAjuste(a.ticker, de, a.para, agora[a.ticker]?.pm || 0, hoje), id: novoId() });
        nAj++;
      }
    }
    salvar();
    aviso(`${plural(nAtivos, "ativo atualizado", "ativos atualizados")} em ${c.nome}${nAj ? `, ${plural(nAj, "igualado", "igualados")} à posição da B3` : ""}`);
    if (location.hash === "#carteira") render(); else ir("#carteira");
  };
}

/* ---------- backup ---------- */
function exportarBackup() {
  const blob = new Blob([JSON.stringify(S.estado, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `milhao-backup-${hojeISO()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#arquivo-backup").addEventListener("change", async (e) => {
  const arq = e.target.files[0]; e.target.value = "";
  if (!arq) return;
  try {
    const s = JSON.parse(await arq.text());
    if (!Array.isArray(s.carteiras)) throw new Error("arquivo não é um backup do Milhão");
    const ok = await perguntar({ titulo: "Restaurar backup?", botao: "Restaurar",
      texto: `O arquivo tem ${s.carteiras.length} ${s.carteiras.length === 1 ? "carteira" : "carteiras"}. Elas substituem as carteiras atuais deste navegador.` });
    if (!ok) return;
    S.estado = { ...s, perfil: s.perfil || S.estado.perfil }; salvar(); aviso("Backup restaurado"); ir("#carteiras");
  } catch (err) { aviso("Não deu para restaurar: " + err.message); }
});

      <div><span>Total recebido</span><strong>${brl(rec.reduce((s, p) => s + p.total, 0))}</strong></div></div>
    <div class="painel"><h2>Recebido por ano</h2><div id="g-prov"></div></div>

    <tbody>${provs.map((p) => `<tr><td class="esq"><a class="tk" href="#ativo-${p.ticker}">${p.ticker}</a></td><td class="esq">${esc(p.tipo)}</td><td>${dataBR(p.data_com)}</td><td>${dataBR(p.pagamento)}</td>

/* ---------- valuation: fluxo de caixa descontado e modelo de dividendos ---------- */
const TAXA_PADRAO = 14, PERPETUO_PADRAO = 4; // % ao ano; o usuário ajusta na tela
const arred = (v, passo = 0.5) => Math.round(v / passo) * passo;
function baseFluxo(d, qual) {
  const f = d.fluxo || {}, anos = Object.entries(f.anual || {}).sort().map(([, v]) => v.fcl).filter((v) => !vazio(v));
  if (qual === "12m") return f["12m"]?.fcl ?? null;
  if (qual === "ano") return anos.at(-1) ?? null;
  const ult = anos.slice(-3);
  return ult.length ? ult.reduce((s, v) => s + v, 0) / ult.length : null;
}
function premissasSugeridas(d) {
  const cagr = d.ind?.cagr_rec;
  const g = vazio(cagr) ? 5 : Math.min(Math.max(arred(cagr * 100), 0), 12);
  return d.banco
    ? { taxa: TAXA_PADRAO + 1, perpetuo: PERPETUO_PADRAO, dpa: Math.round(d.preco * (d.ind?.dy || 0) * 100) / 100 }
    : { base: "media3", cresc: g, perpetuo: PERPETUO_PADRAO, taxa: TAXA_PADRAO };
}
function calcularFcd(d, p) {
  const fcl0 = baseFluxo(d, p.base), acoes = d.base?.acoes, dl = d.base?.divida_liquida ?? 0;
  const r = p.taxa / 100, gp = p.perpetuo / 100, g5 = p.cresc / 100;
  if (vazio(fcl0) || !acoes) return { erro: "Falta o fluxo de caixa ou a quantidade de ações desta empresa nos dados da CVM." };
  if (r <= gp) return { erro: "A taxa de desconto precisa ser maior que o crescimento na perpetuidade." };
  if (fcl0 <= 0) return { erro: "O fluxo de caixa livre está negativo na base escolhida, e aí o desconto de fluxos dá um valor negativo. Experimente outra base ou olhe Graham e Bazin.", fcl0 };
  const anos = []; let fcl = fcl0, somaVp = 0;
  for (let k = 1; k <= 10; k++) {
    const g = k <= 5 ? g5 : g5 + (gp - g5) * (k - 5) / 5;
    fcl *= 1 + g; const vp = fcl / (1 + r) ** k; somaVp += vp;
    anos.push({ k, g, fcl, vp });

  const perp = fcl * (1 + gp) / (r - gp), vpPerp = perp / (1 + r) ** 10;

  return { fcl0, anos, somaVp, vpPerp, ev, dl, equity, acoes, preco, upside: preco / d.preco - 1 };

function calcularGordon(d, p) {
  const r = p.taxa / 100, g = p.perpetuo / 100;

  if (r <= g) return { erro: "O custo de capital precisa ser maior que o crescimento dos dividendos." };

}

function graficoFluxo(el, d) {

        <tbody>${res.anos.map((a) => `<tr><td>${a.k}</td><td>${pct(a.g, 1)}</td><td>${compacto(a.fcl)}</td><td>${compacto(a.vp)}</td></tr>`).join("")}</tbody></table></div></details>`;
  };
  f.addEventListener("input", mostrar);
  $("#fcd-padrao").onclick = () => {
    const s = premissasSugeridas(d);
    for (const [k, v] of Object.entries(s)) if (f[k]) f[k].value = typeof v === "number" ? (k === "dpa" ? v.toFixed(2) : v) : v;
    mostrar();
  };
  mostrar();
}

  }

  const abas = fii
    ? [["resumo", "Resumo"], ["rendimentos", "Rendimentos"], ["fundo", "Sobre o fundo"]]

        <p style="margin:2px 0 10px;text-align:right" class="${cls(d.var_dia)}">${pct(d.var_dia, 2, true)} no dia, fechamento de ${dataBR(d.data)}</p>
        <div class="acoes" style="justify-content:flex-end">
          <button class="btn favoritar" id="fav" aria-pressed="${ehFavorito(d.ticker)}">${ICO.estrela}${ehFavorito(d.ticker) ? "Favorito" : "Favoritar"}</button>
          <a class="btn" href="#comparar-${[d.ticker, ...(d.pares || []).filter((p) => S.porTicker[p]).slice(0, 4)].join(",")}">${ICO.comparar}Comparar com o setor</a>
          <button class="btn primario" id="add">Adicionar à carteira</button></div></div>
    </div>
    ${avisoConferencia(d)}
    ${pos ? `<p class="sutil" style="margin:-8px 0 16px">Você tem ${qtdF(pos.qtd)} ${classe(d.tipo).unidade} a ${brl(pos.pm)} de preço médio: <b class="${cls(pos.resultado)}">${pct(pos.custo ? pos.resultado / pos.custo : null, 1, true)}</b>.</p>` : ""}
    <div class="abas" role="tablist">${abas.map(([k, n], i) => `<button role="tab" aria-selected="${i === 0}" data-aba="${k}">${n}</button>`).join("")}</div>
    ${abas.map(([k], i) => `<section data-painel="${k}" class="${i ? "oculto" : ""}">${(fii ? PAINEIS_FII : simples ? PAINEIS_MERCADO : PAINEIS_ACAO)[k](d, ind, med)}</section>`).join("")}
    <p class="fraco" style="margin-top:18px">Calculado pelo Milhão com ${simples ? "" : `dados da CVM${d.base?.referencia ? " até " + dataBR(d.base.referencia) : ""} e `}cotações da B3. Não é recomendação de investimento. Viu algo estranho neste ativo? <a href="#reclame-dado-${encodeURIComponent(d.ticker)}">Avise a gente</a>. Quer trocar ideia sobre ${esc(d.ticker)}? <a href="#comunidade-ativo-${encodeURIComponent(d.ticker)}">Veja na Comunidade</a>.</p>`;
  $("#add").onclick = () => abrirLancamento(d.ticker);
  $("#fav").onclick = (e) => {
    const agora = alternarFavorito(d.ticker), b = e.currentTarget;
    b.setAttribute("aria-pressed", agora); b.innerHTML = ICO.estrela + (agora ? "Favorito" : "Favoritar");
    aviso(agora ? `${d.ticker} entrou nos favoritos` : `${d.ticker} saiu dos favoritos`);
  };
  // gráficos só são desenhados quando a aba aparece (escondidos, eles ficariam sem largura)
  const desenhado = new Set();
  const desenhar = (k) => {
    if (desenhado.has(k)) return; desenhado.add(k);
    if (k === "resumo") ligarCotacao(d);
    if (k === "dividendos" || k === "rendimentos") graficoProventos(d);
    if (k === "preco") { ligarValuation(d); ligarTeto(d); }
    if (k === "numeros") graficoFluxo($("#g-fluxo"), d);

    $$("[data-aba]").forEach((b) => b.setAttribute("aria-selected", b.dataset.aba === k));

  $$("[data-ir-aba]").forEach((b) => b.onclick = (e) => { e.preventDefault(); abrir(b.dataset.irAba); window.scrollTo({ top: 0, behavior: "smooth" }); });
  desenhar("resumo");
};

/* ---------- página do ativo: peças ---------- */
function blocoCotacao(d) {
  return `<div class="painel"><div class="cabeca" style="margin-bottom:6px"><div style="display:flex;align-items:baseline;gap:14px"><h2 style="margin:0">Cotação</h2>
      <a class="link-analise" href="#analise-${d.ticker}">${ICO.analise}Ver em candles</a></div>
      <div class="periodos">${[["1M", 31], ["6M", 183], ["1A", 366], ["5A", 1830]].map(([n, dd], i) => `<button aria-pressed="${i === 2}" data-dias="${dd}">${n}</button>`).join("")}</div></div>
    <div class="grafico" id="g-preco"></div><p class="fraco" id="rent-periodo" style="margin:6px 0 0"></p></div>`;
}
function ligarCotacao(d) {
  const fii = d.tipo !== "acao" && d.tipo !== "bdr", todos = d.precos.map(([dd, v]) => ({ d: dd, v }));
  const periodo = (dias) => {
    const corte = new Date(new Date(d.data).getTime() - dias * 864e5).toISOString().slice(0, 10);
    const pts = todos.filter((p) => p.d >= corte);
    graficoLinha($("#g-preco"), pts, { altura: 280, cor: pts.at(-1).v >= pts[0].v ? "var(--verde)" : "var(--queda)" });
    const r = pts.length > 1 ? pts.at(-1).v / pts[0].v - 1 : null;
    $("#rent-periodo").innerHTML = `Variação no período: <b class="${cls(r)}">${pct(r, 1, true)}</b> (sem contar ${fii ? "rendimentos" : "dividendos"})`;
  };
  $$(".periodos button").forEach((b) => b.onclick = () => { $$(".periodos button").forEach((x) => x.setAttribute("aria-pressed", x === b)); periodo(+b.dataset.dias); });
  periodo(366);
}
function blocoProventos(d) {
  const fii = d.tipo !== "acao" && d.tipo !== "bdr";
  return `<div class="painel"><div class="cabeca" style="margin-bottom:8px"><h2 style="margin:0">${fii ? "Rendimentos" : "Dividendos e JCP"}</h2>
      ${d.proventos_estimados ? `<span class="fraco">Estimados pelo informe mensal da CVM</span>` : ""}</div>
    <div class="grade g-2"><div><h3 style="margin-bottom:8px">Pago por ${fii ? "cota" : "ação"}, por ano</h3><div id="g-div"></div></div>
    <div class="rolagem" style="max-height:260px"><table><thead><tr><th class="esq">Tipo</th><th>Data com</th><th>Pagamento</th><th>Valor</th></tr></thead>
    <tbody>${(d.proventos || []).slice(0, 40).map((p) => `<tr><td class="esq">${esc(p.tipo)}</td><td>${dataBR(p.data_com)}</td><td>${dataBR(p.pagamento)}</td><td>${brl(p.valor, 4)}</td></tr>`).join("") || `<tr><td colspan="4" class="vazio">Sem proventos registrados.</td></tr>`}</tbody></table></div></div>
    <p class="fraco" style="margin:10px 0 0">Data com: quem tem a ${fii ? "cota" : "ação"} no fim desse dia recebe o pagamento.</p></div>`;
}
function graficoProventos(d) {
  const porAno = {};
  for (const p of d.proventos || []) if (p.data_com) { const a = p.data_com.slice(0, 4); porAno[a] = (porAno[a] || 0) + p.valor; }
  const anoAtual = String(new Date().getFullYear());
  graficoBarras($("#g-div"), Object.entries(porAno).sort().slice(-6).map(([r, v]) => ({ r, v, parcial: r === anoAtual })), { formato: (v) => brl(v, 2) });
}

/* veredito em português claro: barata, no preço ou cara */
function veredito(d) {
  const fcd = precoJustoSugerido(d);
  const metodo = fcd ? (d.banco ? "pelos dividendos que o banco paga" : "pelo caixa que a empresa gera") : d.graham ? "pela fórmula de Graham (lucro e patrimônio)" : null;
  const justo = fcd || d.graham || null;
  if (!justo) return { justo: null, classe: "", titulo: "Sem dados para estimar", texto: "A empresa está com prejuízo ou sem histórico suficiente, então não dá para calcular um preço justo agora." };
  const up = justo / d.preco - 1;
  if (up > 0.15) return { justo, up, metodo, classe: "barata", titulo: "Abaixo do preço justo", texto: `O preço justo estimado ${metodo} é ${brl(justo)}, ${pct(up, 0)} acima da cotação de hoje.` };
  if (up < -0.10) return { justo, up, metodo, classe: "cara", titulo: "Acima do preço justo", texto: `O preço justo estimado ${metodo} é ${brl(justo)}, ${pct(-up, 0)} abaixo da cotação de hoje.` };
  return { justo, up, metodo, classe: "nopreco", titulo: "Perto do preço justo", texto: `O preço justo estimado ${metodo} é ${brl(justo)}, bem perto da cotação de hoje.` };
}
function blocoVeredito(d, grande = false) {
  const v = veredito(d);
  return `<div class="veredito ${v.classe}${grande ? " grande" : ""}">
      <div><span class="rotulo">${v.justo ? "Preço justo estimado" : "Preço justo"}</span><strong>${v.justo ? brl(v.justo) : "–"}</strong></div>
      <div><span class="selo-v">${v.titulo}</span><p>${v.texto}${v.justo ? ` <span class="fraco">Estimativa automática, não é recomendação de compra ou venda.</span>` : ""}</p>
        ${grande ? "" : `<a href="#" data-ir-aba="preco">Entender a conta</a>`}</div></div>`;
}
function nivelDivida(d) {
  const dl = d.base?.divida_liquida, eb = d.ind?.dl_ebitda;
  if (d.banco) return null;
  if (vazio(dl)) return { nivel: "–", texto: "Sem dados de dívida." };
  if (dl <= 0) return { nivel: "Sem dívida", texto: "Tem mais dinheiro em caixa do que dívidas." };
  if (vazio(eb) || eb < 0) return { nivel: "Atenção", texto: `Deve ${compacto(dl)} e o resultado operacional não cobre com folga.` };
  if (eb < 1.5) return { nivel: "Baixa", texto: `Pagaria a dívida em ${xv(eb, 1)} ano${eb >= 2 ? "s" : ""} de geração de caixa.` };
  if (eb < 3) return { nivel: "Moderada", texto: `Pagaria a dívida em ${xv(eb, 1)} anos de geração de caixa.` };
  return { nivel: "Alta", texto: `Precisaria de ${xv(eb, 1)} anos de geração de caixa para pagar a dívida.` };
}

        ${v ? `<em class="${cls(up(v))}">${pct(up(v), 0, true)} em relação à cotação</em>` : ""}<p>${tx}</p></div>`).join("")}</div></div>

    <div class="painel"><h2>Sobre a empresa</h2><div class="info">

const PAINEIS_FII = {

    const cartoes = [

/* ---------- preço teto: preço justo pelo fluxo de caixa menos a margem de segurança ---------- */
const margemSeguranca = () => S.estado?.margem ?? 0.25;
function precoTeto(d) {
  const j = d && d.tipo !== "fii" ? precoJustoSugerido(d) : null;
  // preço justo muito abaixo da cotação (menos de 15%) é sinal de que o modelo não serve para a empresa agora
  return j && !(d.preco && j < d.preco * 0.15) ? j * (1 - margemSeguranca()) : null;
}
function blocoTeto(d) {
  const teto = precoTeto(d), justo = precoJustoSugerido(d), m = margemSeguranca();
  const abaixo = teto && d.preco <= teto;
  return `<div class="painel teto" id="teto">
    <div><span class="rotulo">Preço teto pelo ${d.banco ? "modelo de dividendos" : "fluxo de caixa"}</span>
      <strong>${teto ? brl(teto) : "Não se aplica agora"}</strong>
      ${teto ? `<p>É até onde vale pagar para ter <b>${pct(m, 0)}</b> de margem de segurança sobre o preço justo de ${brl(justo)}.
        Hoje a cotação de ${brl(d.preco)} está <b class="${abaixo ? "alta" : "baixa"}">${abaixo ? "abaixo do teto" : "acima do teto"}</b>.</p>`
        : `<p>Sem preço justo pelo fluxo de caixa para esta empresa, não dá para calcular o teto.</p>`}</div>
    <label class="campo margem">Margem de segurança<span><input type="number" id="margem" min="0" max="90" step="5" value="${Math.round(m * 100)}"> %</span></label>
  </div>`;
}
function ligarTeto(d) {
  const campo = $("#margem"); if (!campo) return;
  campo.onchange = () => {
    const v = Math.min(Math.max(numeroBR(campo.value), 0), 90), caixa = $("#teto");
    if (!Number.isFinite(v) || !caixa?.isConnected || v / 100 === margemSeguranca()) return;
    S.estado.margem = v / 100; salvar();
    const novo = document.createElement("div"); novo.innerHTML = blocoTeto(d);
    caixa.replaceWith(novo.firstElementChild); ligarTeto(d);
  };
}

/* leitura em português claro do que o gráfico mostra (sempre no diário) */
function leituraGrafico(dados, pos, teto, d) {
  const c = dados.c, n = c.length, ult = c[n - 1];
  const mm50 = mediaMovel(c, 50)[n - 1], mm200 = mediaMovel(c, 200)[n - 1], forca = indiceForcaRelativa(c)[n - 1];
  const ano = Math.max(0, n - 252), max52 = Math.max(...dados.h.slice(ano)), min52 = Math.min(...dados.l.slice(ano));
  const onde = max52 > min52 ? (ult - min52) / (max52 - min52) : null;
  const tendencia = mm200 === null
    ? ["Pouco histórico", "Ainda não há 200 pregões para medir a tendência longa."]
    : ult >= mm200 && (mm50 ?? ult) >= mm200 ? ["Alta no longo prazo", "A cotação e a média de 50 dias estão acima da média de 200 dias."]
    : ult < mm200 && (mm50 ?? ult) < mm200 ? ["Baixa no longo prazo", "A cotação e a média de 50 dias estão abaixo da média de 200 dias."]
    : ["Indefinida", "A cotação está cruzando a média de 200 dias: o mercado ainda não escolheu direção."];
  const ifrTxt = forca === null ? ["–", "Pouco histórico."]
    : forca >= 70 ? [xv(forca, 0), "Subiu forte nos últimos dias. Costuma ser chamado de sobrecompra."]
    : forca <= 30 ? [xv(forca, 0), "Caiu forte nos últimos dias. Costuma ser chamado de sobrevenda."]
    : [xv(forca, 0), "Sem exagero para cima nem para baixo."];
  const cartoes = [];
  if (pos) cartoes.push(["Sua posição", `${qtdF(pos.qtd)} ${classe(S.porTicker[pos.ticker]?.tipo).unidade}`,

  if (teto) cartoes.push(["Preço teto", brl(teto), `Pelo ${d?.banco ? "modelo de dividendos" : "fluxo de caixa"}, com ${pct(margemSeguranca(), 0)} de margem. Hoje está <b class="${ult <= teto ? "alta" : "baixa"}">${ult <= teto ? "abaixo do teto" : "acima do teto"}</b>.`]);
  cartoes.push(["Tendência", tendencia[0], tendencia[1]]);
