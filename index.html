];
const SUGESTOES_FILTRAO = ["Como importo minhas ações da B3?", "O que é preço teto?", "Como está minha carteira?", "Como uso o gráfico da Análise?"];
const FT = { aberto: false, msgs: [], pensando: false };

function montarFiltrao() {
  if ($("#filtrao")) return;
  const raiz = document.createElement("div");
  raiz.id = "filtrao"; raiz.className = "filtrao";
  raiz.innerHTML = `
    <section class="filtrao-painel" id="filtrao-painel" role="dialog" aria-label="Filtrão, assistente do Milhão" hidden>
      <header class="filtrao-cabeca">${FILTRAO_SVG("mini")}
        <div><strong>Filtrão</strong><span>Assistente do Milhão</span></div>
        <button class="filtrao-icone" id="filtrao-nova" title="Nova conversa" aria-label="Começar uma nova conversa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
        <button class="filtrao-icone" id="filtrao-fechar" title="Fechar" aria-label="Fechar o Filtrão"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="filtrao-conversa" id="filtrao-conversa" aria-live="polite"></div>
      <form class="filtrao-escrever" id="filtrao-form">
        <textarea id="filtrao-texto" rows="1" maxlength="1500" placeholder="Pergunte ao Filtrão" aria-label="Sua pergunta para o Filtrão"></textarea>
        <button type="submit" class="filtrao-enviar" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </form>
      <p class="filtrao-aviso">Respostas do Gemini, do Google. Sua pergunta e um resumo da carteira vão para ele. Não é recomendação de investimento.</p>
    </section>
    <button class="filtrao-botao" id="filtrao-botao" aria-label="Abrir o Filtrão, assistente do Milhão" aria-expanded="false" aria-controls="filtrao-painel">
      <span class="filtrao-cena"><span class="filtrao-orbita" aria-hidden="true">${ORBITA_FILTRAO.map((ico, k) => `<i style="--a:${k * 90}deg">${ico}</i>`).join("")}</span>${FILTRAO_SVG()}</span><span class="filtrao-dica">Dúvidas? Chama o Filtrão</span>
    </button>`;
  document.body.appendChild(raiz);
  $("#filtrao-botao").onclick = () => abrirFiltrao(!FT.aberto);
  $("#filtrao-fechar").onclick = () => abrirFiltrao(false);
  $("#filtrao-nova").onclick = () => { FT.msgs = []; desenharFiltrao(); $("#filtrao-texto").focus(); };
  const txt = $("#filtrao-texto");
  txt.addEventListener("input", () => { txt.style.height = "auto"; txt.style.height = Math.min(txt.scrollHeight, 120) + "px"; });
  txt.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#filtrao-form").requestSubmit(); } });
  $("#filtrao-form").onsubmit = (e) => {
    e.preventDefault();
    const t = txt.value.trim(); if (!t || FT.pensando) return;
    txt.value = ""; txt.style.height = "auto"; perguntarFiltrao(t);
  };
  const botao = $("#filtrao-botao");
  botao.classList.add("ocioso");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    let quadro = 0, parado = 0;
    document.addEventListener("pointermove", (e) => {
      if (e.pointerType === "touch" || quadro) return;
      quadro = requestAnimationFrame(() => {
        quadro = 0;
        const r = botao.getBoundingClientRect(); if (!r.width) return;
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * 0.45), d = Math.hypot(dx, dy) || 1;
        const k = Math.min(1, d / 120);   // perto, ele olha menos de lado
        botao.style.setProperty("--ox", (dx / d * 2.1 * k).toFixed(2) + "px");
        botao.style.setProperty("--oy", (dy / d * 1.8 * k).toFixed(2) + "px");
        botao.classList.remove("ocioso"); clearTimeout(parado);
        parado = setTimeout(() => botao.classList.add("ocioso"), 4000);
      });
    }, { passive: true });
  }
  raiz.addEventListener("keydown", (e) => { if (e.key === "Escape" && FT.aberto) { abrirFiltrao(false); $("#filtrao-botao").focus(); } });
}
function abrirFiltrao(abrir) {
  FT.aberto = abrir;
  const p = $("#filtrao-painel");
  p.hidden = !abrir; $("#filtrao").classList.toggle("aberto", abrir);
  $("#filtrao-botao").setAttribute("aria-expanded", abrir);
  if (abrir) { desenharFiltrao(); setTimeout(() => $("#filtrao-texto").focus(), 50); }
}
/* texto simples do Gemini → HTML seguro (negrito, listas e parágrafos) */
function textoFiltrao(t) {
  let html = "", lista = false;
  for (let l of esc(t).split("\n")) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^#{1,4}\s*(.+)/, "<b>$1</b>");
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!lista) { html += "<ul>"; lista = true; } html += `<li>${m[1]}</li>`; continue; }
    if (lista) { html += "</ul>"; lista = false; }
    if (l.trim()) html += `<p>${l}</p>`;
  }
  return html + (lista ? "</ul>" : "");
}
function desenharFiltrao() {
  const box = $("#filtrao-conversa"); if (!box) return;
  const nome = (S.estado?.perfil?.nome || "").split(" ")[0];
  const oi = `<div class="fm dele"><p>Oi${nome ? ", " + esc(nome) : ""}! Eu sou o <b>Filtrão</b>. Tiro dúvidas sobre o Milhão, sobre a sua carteira e sobre os números das ações e FIIs.</p></div>`;
  box.innerHTML = oi + FT.msgs.map((m) => `<div class="fm ${m.de === "eu" ? "meu" : "dele"}${m.erro ? " erro" : ""}">${m.de === "eu" ? `<p>${esc(m.texto)}</p>` : textoFiltrao(m.texto)}${m.ouro ? `<a href="#perfil" class="filtrao-cta">Conhecer o Milhão Ouro</a>` : ""}</div>`).join("")
    + (FT.pensando ? `<div class="fm dele pensando" aria-label="Filtrão está pensando"><span></span><span></span><span></span></div>` : "")
    + (!FT.msgs.length ? `<div class="filtrao-sugestoes">${SUGESTOES_FILTRAO.map((s) => `<button type="button">${esc(s)}</button>`).join("")}</div>` : "");
  $$(".filtrao-sugestoes button", box).forEach((b) => b.onclick = () => perguntarFiltrao(b.textContent));
  $$(".filtrao-cta", box).forEach((a) => a.onclick = () => abrirFiltrao(false));
  box.scrollTop = box.scrollHeight;
}
/* o que o Filtrão precisa saber agora: a tela aberta, a carteira e o ativo em foco */
async function contextoFiltrao() {
  const L = [`Nome: ${S.estado?.perfil?.nome || "não informado"}`, `Hoje: ${dataBR(hojeISO())}. Cotações de fechamento de ${dataBR(S.meta?.ultimo_pregao)}.`,
    `Tela aberta: ${location.hash || "#carteiras"}. Modo ${temaEscuro() ? "escuro" : "claro"}.`];
  const cs = S.estado?.carteiras || [];
  L.push(`Carteiras: ${cs.map((c) => c.nome).join(", ") || "nenhuma"}.`);
  const c = carteira();
  if (c) {
    const r = resumoCarteira(c);
    L.push(`Carteira aberta: ${c.nome}. Patrimônio ${brl(r.total)}, investido ${brl(r.custo)}, resultado ${pct(r.resultadoPct, 1, true)} (${brl(r.resultado)}), variação hoje ${pct(r.diaPct, 2, true)}, yield estimado ${pct(r.yield, 1)}.`);
    const pos = [...r.pos].sort((a, b) => (b.valor || 0) - (a.valor || 0)).slice(0, 30);
    if (pos.length) {
      L.push("Posições (ativo | tipo | quantidade | preço médio | cotação | resultado | % da carteira | preço teto):");
      for (const p of pos) {
        const a = S.porTicker[p.ticker], d = S.det[p.ticker], teto = d ? precoTeto(d) : null;
        L.push(`${p.ticker} | ${classe(a?.tipo).rotulo} | ${qtdF(p.qtd)} | ${brl(p.pm)} | ${brl(p.preco)} | ${pct(p.custo ? (p.valor - p.custo) / p.custo : null, 1, true)} | ${pct(r.total ? p.valor / r.total : null, 1)} | ${teto ? brl(teto) : "–"}`);
      }
    }
  }
  const t = (location.hash.match(/^#(?:ativo|analise)-(.+)$/) || [])[1];
  if (t && S.porTicker[decodeURIComponent(t)]) {
    const tk = decodeURIComponent(t), a = S.porTicker[tk];
    let d = null; try { d = a.tipo === "acao" ? await detalhe(tk) : null; } catch (e) { /* sem detalhe */ }
    const ind = [["P/L", a.pl, 1], ["P/VP", a.pvp, 2], ["ROE", a.roe, "%"], ["Margem líquida", a.m_liq, "%"], ["Dívida líq./EBITDA", a.dl_ebitda, 1], ["EV/EBIT", a.ev_ebit, 1],
      ["Crescimento do lucro (5 anos, ao ano)", a.cagr_luc, "%"], ["Variação em 12 meses", a.var_12m, "%"], ["Dividend yield", a.dy, "%"]]
      .filter(([, v]) => v != null && Number.isFinite(v)).map(([n, v, f]) => `${n} ${f === "%" ? pct(v, 1) : xv(v, f)}`).join("; ");
    const justo = d ? precoJustoSugerido(d) : null, teto = d ? precoTeto(d) : null;
    L.push(`Ativo na tela: ${tk} (${a.n}), ${a.tipo === "fii" ? "FII" : "ação"}, setor ${a.setor || "–"}. Cotação ${brl(a.preco)} (${pct(a.var_dia, 2, true)} no dia). ${ind}.`
      + (justo ? ` Preço justo estimado ${brl(justo)}; preço teto ${brl(teto)} com margem de ${pct(margemSeguranca(), 0)}.` : ""));
  }
  return L.join("\n");
}
async function perguntarFiltrao(texto) {
  FT.msgs.push({ de: "eu", texto }); FT.pensando = true; desenharFiltrao(); $("#filtrao").classList.add("pensando");
  let resposta, erro = false;
  try {
    if (!S.nuvem || !S.usuario) throw Object.assign(new Error("sem_login"), { codigo: "sem_login" });
    const { data, error } = await S.nuvem.functions.invoke("filtrao", {
      body: { mensagens: FT.msgs.filter((m) => !m.erro).slice(-12), contexto: await contextoFiltrao() },
    });
    if (error) {
      let codigo = "falha"; try { codigo = (await error.context.json()).erro || codigo; } catch (e) { codigo = error.name === "FunctionsFetchError" ? "rede" : codigo; }
      throw Object.assign(new Error(codigo), { codigo });
    }
    resposta = data?.texto || "Fiquei sem palavras agora. Pode perguntar de outro jeito?";
  } catch (e) {
    erro = true;
    resposta = {
      sem_login: "Entre na sua conta do Milhão para a gente conversar.",
      sem_chave: "Ainda estou sendo ligado. Volto já, já!",
      limite_pessoa: "Ufa, muita pergunta seguida! Me dá uns minutinhos e pergunta de novo.",
      limite: "Tem muita gente me chamando agora. Tenta de novo em um minuto.",
      limite_gratis: `Você já fez as ${LIMITES_GRATIS.filtrao} perguntas de hoje do plano Grátis. Amanhã tem mais! Com o Milhão Ouro a gente conversa sem limite.`,
      rede: "Parece que a internet caiu. Confere a conexão e tenta de novo.",
    }[e.codigo] || "Não consegui responder agora. Tenta de novo daqui a pouco.";
  }
  FT.msgs.push({ de: "filtrao", texto: resposta, erro, ouro: erro && resposta.includes("Milhão Ouro") }); FT.pensando = false; desenharFiltrao(); $("#filtrao").classList.remove("pensando");
}

/* ---------- início ---------- */
async function iniciar() {
  S.estado = carregarEstado();
  S.nuvem = iniciarNuvem();
  if (S.nuvem) {
    // link de "esqueci minha senha": o Supabase avisa com PASSWORD_RECOVERY e a pessoa cria a senha nova
    S.nuvem.auth.onAuthStateChange((evento) => {
      if (evento !== "PASSWORD_RECOVERY") return;
      S.recuperando = true;
      if (S.ativos.length) setTimeout(() => telaLogin(curvaEntrada(), "nova"), 0);
    });
    const { data } = await S.nuvem.auth.getSession();
    if (data.session) await abrirConta(data.session.user);
    else S.estado = { perfil: null, carteiras: [], ativa: null };
    if (/[?&]code=/.test(location.search)) history.replaceState(null, "", SITE + location.hash);
  }
  try {
    [S.meta, S.ativos] = await Promise.all([j("data/meta.json"), j("data/ativos.json")]);
  } catch (e) {
    $("#raiz").innerHTML = `<main class="conteudo"><div class="marca" style="font-size:36px;margin-bottom:24px">Milhão.</div><div class="painel vazio"><h3>Os dados do mercado ainda não foram gerados</h3><p>Rode o robô de dados (etl/milhao_dados.py) ou espere a próxima atualização automática. Detalhe: ${esc(e.message)}</p></div></main>`;
    return;
  }
  S.porTicker = Object.fromEntries(S.ativos.map((a) => [a.t, a]));
  $("#lista-tickers").innerHTML = S.ativos.map((a) => `<option value="${a.t}">${esc(a.n)}</option>`).join("");
  if (S.recuperando) return telaLogin(curvaEntrada(), "nova");
  render();
}
iniciar().finally(() => window.__fecharAbertura && window.__fecharAbertura());
