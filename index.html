  return `<div class="cartoes leitura-cartoes n${cartoes.length}">${cartoes.map(([nm, v, tx]) => `<div><span>${nm}</span><strong>${v}</strong><p>${tx}</p></div>`).join("")}</div>
    <p class="fraco" style="margin:0">Leitura automática dos números do gráfico. Não é recomendação de compra ou venda.</p>`;
}

/* ---------- seletor de carteiras: resumo de cada carteira e o mercado do dia ---------- */
function resumoCarteira(c) {
  const pos = posicoes(c).filter((p) => p.qtd > 0);
  let total = 0, custo = 0, dia = 0, renda = 0;
  for (const p of pos) {
    const a = S.porTicker[p.ticker], v = p.valor || 0;
    total += v; custo += p.custo;
    if (a?.var_dia != null) dia += v - v / (1 + a.var_dia);
    renda += v * (a?.dy || 0);
  }
  return { pos, total, custo, dia, diaPct: total ? dia / (total - dia) : null, resultado: total - custo,
    resultadoPct: custo ? (total - custo) / custo : null, yield: total ? renda / total : null };
}
function miniGrafico(pontos) {
  if (pontos.length < 2) return "";
  const vs = pontos.map((p) => p.v), mn = Math.min(...vs), mx = Math.max(...vs) || 1;
  const pts = vs.map((v, i) => `${(i / (vs.length - 1) * 100).toFixed(2)},${(36 - ((v - mn) / ((mx - mn) || 1)) * 32).toFixed(2)}`).join(" ");
  const cor = vs.at(-1) >= vs[0] ? "var(--verde-2)" : "var(--queda)";
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

  const negociadas = [...S.ativos].sort((a, b) => (b.liq || 0) - (a.liq || 0)).slice(0, 5);
  const lista = (titulo, itens, extra) => `<div class="painel mercado-lista"><h3>${titulo}</h3><ol>${itens.map((a) => `<li>

  const p = patrimonioDe(escopo), aporte = meta?.aporte ?? aporteMedio(escopo), taxa = (meta?.taxa ?? 10) / 100;
  const meses = mesesAte(p, aporte, taxa, alvo), prog = Math.min(1, p / alvo);
  const frase = prog >= 1 ? "Você já chegou lá." : meses == null ? "No ritmo atual, leva mais de 80 anos. Veja quanto aportar por mês para chegar antes."
    : `No ritmo atual (${brl(aporte, 0)} por mês e ${pctTaxa(taxa)} ao ano), você chega lá por volta de ${mesAno(mesDaqui(meses))}.`;
  return `<a class="painel rumo" href="#metas">
    <div class="rumo-texto"><span>${meta ? esc(meta.nome) : "Rumo ao primeiro milhão"}</span><strong>${brl(p, 0)} <small>de ${brl(alvo, 0)}</small></strong><p>${frase}</p></div>
    <div class="rumo-barra"><div class="meta-barra"><span style="width:${Math.max(prog * 100, 0.6).toFixed(2)}%"></span></div><em>${pct(prog, prog < 0.1 ? 2 : 1)}</em></div>
    <span class="rumo-link">${meta ? "Ver metas" : "Criar uma meta"}</span></a>`;
}

const FGC_RF = new Set(["CDB", "LCI", "LCA", "LC", "RDB", "LIG", "Poupança"]);   // garantidos pelo FGC
const ISENTO_RF = new Set(["LCI", "LCA", "LIG", "CRI", "CRA", "Poupança"]);
const INDEXADORES = { cdi: "% do CDI", cdimais: "CDI + taxa", pre: "Prefixado", ipca: "IPCA + taxa", poup: "Poupança" };
const ROT_TAXA = { cdi: "Quanto do CDI (%)", cdimais: "Taxa acima do CDI (% ao ano)", pre: "Taxa (% ao ano)", ipca: "Taxa acima do IPCA (% ao ano)" };
const TIPOS_OUTRO = { previdencia: "Previdência privada", conta: "Saldo em conta", imovel: "Imóvel", exterior: "Investimento no exterior", veiculo: "Veículo", outro: "Outro bem" };

/* contas de data */
const somaDias = (iso, n) => new Date(Date.parse(iso + "T12:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const diasEntre = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function semanaEntre(a, b) {   // dias de segunda a sexta em [a, b)
  let n = 0;
  for (let d = new Date(a + "T12:00:00Z"), fim = Date.parse(b + "T12:00:00Z"); d < fim; d.setUTCDate(d.getUTCDate() + 1)) { const w = d.getUTCDay(); if (w && w < 6) n++; }
  return n;
}
function primeiroIdx(arr, d) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m][0] < d) lo = m + 1; else hi = m; } return lo; }
function ultimoAte(arr, d) { const i = primeiroIdx(arr, d); return arr[i]?.[0] === d ? arr[i] : arr[i - 1] || arr[0] || null; }
const aliquotaIR = (dias) => dias <= 180 ? 0.225 : dias <= 360 ? 0.2 : dias <= 720 ? 0.175 : 0.15;

/* quanto um título de renda fixa rendeu entre a aplicação e "ate", com o CDI e o IPCA do Banco Central */
function fatorRF(it, rf, ate) {
  const ini = it.aplicacao, t = +it.taxa || 0;
  if (!ini || ate <= ini) return 1;
  const cdi = rf?.cdi || [];
  if (it.indexador === "poup") {   // a poupança paga a cada aniversário mensal
    const mapa = new Map(rf?.poupanca || []), ult = rf?.poupanca?.at(-1)?.[1] ?? 0.6;
    let f = 1, k = 1;
    for (;;) {
      const d = new Date(ini + "T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + k);
      const aniv = d.toISOString().slice(0, 10);
      if (aniv > ate) break;
      f *= 1 + (mapa.get(somaDias(aniv, -1).slice(0, 7)) ?? ult) / 100; k++;
    }
    return f;
  }
  // dias úteis e CDI do período; fora da série publicada, repete a taxa da ponta
  let f = 1, du = 0;
  const umDia = (d) => it.indexador === "cdi" ? 1 + d * t / 100 : it.indexador === "cdimais" ? (1 + d) * Math.pow(1 + t / 100, 1 / 252) : 1;
  if (cdi.length) {
    if (ini < cdi[0][0]) { const n = semanaEntre(ini, cdi[0][0] < ate ? cdi[0][0] : ate); du += n; f *= Math.pow(umDia(cdi[0][1] / 100), n); }
    for (let i = primeiroIdx(cdi, ini); i < cdi.length && cdi[i][0] < ate; i++) { du++; f *= umDia(cdi[i][1] / 100); }
    const depois = somaDias(cdi.at(-1)[0], 1);
    if (depois < ate) { const n = semanaEntre(depois > ini ? depois : ini, ate); du += n; f *= Math.pow(umDia(cdi.at(-1)[1] / 100), n); }
  } else du = semanaEntre(ini, ate);
  if (it.indexador === "cdi" || it.indexador === "cdimais") return f;
  const juros = Math.pow(1 + t / 100, du / 252);
  if (it.indexador === "pre") return juros;
  // IPCA: cada mês entra proporcional aos dias corridos; mês ainda sem IPCA usa o último divulgado
  const ipca = new Map(rf?.ipca || []), ultIpca = rf?.ipca?.at(-1)?.[1] ?? 0.4;
  let fi = 1, d = ini;
  while (d < ate) {
    const [y, m] = d.split("-").map(Number), nd = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const prox = new Date(Date.UTC(y, m, 1, 12)).toISOString().slice(0, 10), ate2 = prox < ate ? prox : ate;
    fi *= Math.pow(1 + (ipca.get(d.slice(0, 7)) ?? ultIpca) / 100, diasEntre(d, ate2) / nd);
    d = ate2;
  }
  return fi * juros;
}

/* valor de hoje de cada item: {atual, aplicado, liquido, data, nota} */
async function valorCons(it, D) {
  const hoje = hojeISO(), r = { atual: null, aplicado: it.aplicado ?? null, liquido: null, data: null, nota: "" };
  const comIR = (desde) => { if (r.atual != null && r.aplicado != null) { const ganho = r.atual - r.aplicado; r.liquido = r.atual - Math.max(ganho, 0) * aliquotaIR(diasEntre(desde, hoje)); } };
  if (it.classe === "rf") {
    const ate = it.vencimento && it.vencimento < hoje ? it.vencimento : hoje;
    if (!D.rf && it.indexador !== "pre") { r.atual = r.aplicado; r.nota = "sem o CDI e o IPCA de hoje"; return r; }
    r.atual = (it.aplicado || 0) * fatorRF(it, D.rf, ate);
    r.data = it.indexador === "pre" ? hoje : D.rf?.data;
    if (it.vencimento && it.vencimento < hoje) r.nota = `venceu em ${dataBR(it.vencimento)}`;
    if (it.isento) r.liquido = r.atual; else comIR(it.aplicacao);
  } else if (it.classe === "tesouro") {
    const t = D.td?.titulos?.find((x) => x.id === it.titulo);
    if (t?.pu_venda) { r.atual = it.qtd * t.pu_venda; r.data = t.data; comIR(it.data); }
    else { r.atual = r.aplicado; r.nota = it.venc && it.venc < hoje ? `venceu em ${dataBR(it.venc)}` : "sem preço do Tesouro hoje"; }
  } else if (it.classe === "fundo") {
    const f = await consFundo(it.cnpj), u = f?.d?.at(-1) || f?.m?.at(-1);
    if (u) { r.atual = it.cotas * u[1]; r.data = u[0].length === 7 ? u[0] + "-28" : u[0]; r.nota = "antes do come-cotas e do IR"; }
    else { r.atual = r.aplicado; r.nota = "fundo sem cota recente na CVM"; }
  } else if (it.classe === "cripto") {
    const m = D.cr?.moedas?.find((x) => x[0] === it.moeda);
    if (m) { r.atual = it.qtd * m[3]; r.data = D.cr.data?.slice(0, 10); } else { r.atual = r.aplicado; r.nota = "sem cotação agora"; }
  } else {
    r.atual = it.valor; r.data = it.atualizado; r.aplicado = null;
    if (it.atualizado && diasEntre(it.atualizado, hoje) > 90) r.nota = `valor de ${dataBR(it.atualizado)}: vale atualizar`;
  }
  return r;
}

/* nome e detalhe de cada item na lista */
function descCons(it) {
  if (it.classe === "rf") {
    const idx = it.indexador === "cdi" ? `${nf(it.taxa % 1 ? 1 : 0).format(it.taxa)}% do CDI` : it.indexador === "cdimais" ? `CDI + ${nf(2).format(it.taxa)}%`
      : it.indexador === "pre" ? `${nf(2).format(it.taxa)}% ao ano` : it.indexador === "ipca" ? `IPCA + ${nf(2).format(it.taxa)}%` : "Rende como a poupança";
    return { nome: it.nome || `${it.tipo} ${it.emissor || ""}`.trim(), det: `${idx}${it.vencimento ? ` · vence em ${dataBR(it.vencimento)}` : ""}${it.isento ? " · isento de IR" : ""}` };
  }
  if (it.classe === "tesouro") return { nome: it.nome, det: `${nf(2).format(it.qtd)} títulos · comprado em ${dataBR(it.data)}` };
  if (it.classe === "fundo") return { nome: it.nome, det: `${nf(2).format(it.cotas)} cotas · CNPJ ${cnpjBR(it.cnpj)}` };
  if (it.classe === "cripto") return { nome: it.nome, det: `${nf(it.qtd < 1 ? 6 : 4).format(it.qtd)} ${it.simbolo}` };
  return { nome: it.nome || TIPOS_OUTRO[it.tipo], det: `${TIPOS_OUTRO[it.tipo] || "Outro"}${it.atualizado ? ` · valor de ${dataBR(it.atualizado)}` : ""}` };
}
const cnpjBR = (c) => c ? `${c.slice(0, 2)}.${c.slice(2, 5)}.${c.slice(5, 8)}/${c.slice(8, 12)}-${c.slice(12)}` : "";
const instCons = (it) => (it.inst || (it.classe === "rf" ? it.emissor : "") || "").trim();

/* bolsa: o que está nas carteiras do Milhão, por classe */
function bolsaPorClasse() {
  const soma = {};
  for (const c of S.estado.carteiras) for (const p of posicoes(c)) {
    if (!(p.qtd > 0) || !p.valor) continue;
    const k = S.porTicker[p.ticker]?.tipo || "acao";
    (soma[k] ??= { v: 0, custo: 0 }).v += p.valor; soma[k].custo += p.custo || 0;
  }
  return soma;
}

      + campo("Quantidade de títulos (se souber)", `<input type="text" name="qtd" inputmode="decimal" value="${editando ? numTxt(it.qtd) : ""}" placeholder="Ex.: 0,35">`);
  } else if (classeK === "fundo") {

        <input type="hidden" name="cnpj" value="${esc(it.cnpj || "")}"><input type="hidden" name="nome" value="${esc(it.nome || "")}">
        <div class="sugestoes cons-sug oculto" id="cons-fundo-sug" role="listbox"></div></div>`
      + inst + campo("Data da aplicação", `<input name="data" type="date" required max="${hojeISO()}" value="${it.data || ""}">`)

      + campo("Quantidade de cotas (se souber)", `<input type="text" name="cotas" inputmode="decimal" value="${editando ? numTxt(it.cotas) : ""}">`);

      + campo("Quantidade", `<input type="text" name="qtd" required inputmode="decimal" value="${numTxt(it.qtd)}" placeholder="Ex.: 0,015">`)

      + campo("Onde está (corretora ou carteira)", `<input type="text" name="inst" maxlength="50" value="${esc(it.inst || "")}" placeholder="Ex.: Binance, Mercado Bitcoin" list="cons-insts">`);

async function abrirFormCons(classeK = null, it = {}) {
  const box = $("#cons-form");
  if (!classeK) {
    box.innerHTML = `<div class="painel"><div class="cons-form-topo"><h2>O que você quer adicionar?</h2><button class="btn texto" id="cons-cancelar">Cancelar</button></div>${escolhaCons()}</div>`;
    $("#cons-cancelar").onclick = () => { box.innerHTML = ""; };
    $$("[data-cons-tipo]", box).forEach((b) => b.onclick = () => abrirFormCons(b.dataset.consTipo));
    box.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const D = { td: classeK === "tesouro" ? await consArquivo("tesouro") : null, cr: classeK === "cripto" ? await consArquivo("cripto") : null };
  box.innerHTML = formCons(classeK, it, D);
  const f = $("#f-cons");
  $("#cons-cancelar").onclick = () => { box.innerHTML = ""; };
  if ($("#cons-voltar")) $("#cons-voltar").onclick = () => abrirFormCons();
  if (classeK === "rf") {
    const ajustar = () => {
      const poup = f.tipo.value === "Poupança";
      if (poup) f.indexador.value = "poup";
      const idx = f.indexador.value;
      $(".rf-taxa", f).classList.toggle("oculto", idx === "poup");
      $(".rf-venc", f).classList.toggle("oculto", poup);
      $("#rot-taxa").textContent = ROT_TAXA[idx] || "Taxa";
    };
    f.tipo.onchange = () => { f.isento.checked = ISENTO_RF.has(f.tipo.value); ajustar(); };
    f.indexador.onchange = () => { if (f.indexador.value === "cdi" && !f.taxa.value) f.taxa.value = 100; ajustar(); };
    ajustar();
  }
  if (classeK === "fundo") ligarBuscaFundo(f);
  f.onsubmit = async (e) => {
    e.preventDefault();
    const erro = (msg) => { aviso(msg); return null; };
    const n = (campo) => { const v = numeroBR(f[campo]?.value ?? ""); return Number.isFinite(v) ? v : null; };
    const novo = { id: it.id || novoId(), classe: classeK, inst: f.inst?.value.trim() || "" };
    if (classeK === "rf") {
      Object.assign(novo, { tipo: f.tipo.value, emissor: f.emissor.value.trim(), indexador: f.indexador.value, taxa: n("taxa") ?? 0,
        aplicacao: f.aplicacao.value, vencimento: f.tipo.value === "Poupança" ? null : f.vencimento.value || null, aplicado: n("aplicado"),
        isento: f.isento.checked, nome: f.nome.value.trim() });
      if (!novo.aplicacao) return erro("Coloque a data da aplicação");
      if (!(novo.aplicado > 0)) return erro("Coloque quanto você aplicou");
      if (novo.indexador !== "poup" && !(novo.taxa > 0)) return erro("Coloque a taxa do título");
      if (novo.vencimento && novo.vencimento <= novo.aplicacao) return erro("O vencimento precisa ser depois da aplicação");
    } else if (classeK === "tesouro") {
      const t = f.titulo && D.td.titulos.find((x) => x.id === f.titulo.value);
      if (!t) return erro("Escolha o título");
      if (!f.data.value) return erro("Coloque a data da compra");
      const h = await consArquivo("tesouro/" + t.id), dia = ultimoAte(h?.p || [], f.data.value), pu = dia?.[1] || t.pu_compra;
      let qtd = n("qtd"), aplicado = n("aplicado");
      if (!(qtd > 0) && !(aplicado > 0)) return erro("Coloque o valor investido ou a quantidade de títulos");
      if (!(qtd > 0)) qtd = aplicado / pu;
      if (!(aplicado > 0)) aplicado = qtd * pu;
      Object.assign(novo, { titulo: t.id, nome: `${t.tipo} ${t.venc.slice(0, 4)}`, venc: t.venc, data: f.data.value, qtd, aplicado });
    } else if (classeK === "fundo") {
      if (!f.cnpj.value) return erro("Escolha o fundo na lista");
      if (!f.data.value) return erro("Coloque a data da aplicação");
      const fu = await consFundo(f.cnpj.value);
      let cotas = n("cotas"), aplicado = n("aplicado");
      if (!(cotas > 0) && !(aplicado > 0)) return erro("Coloque o valor aplicado ou a quantidade de cotas");
      const d = f.data.value, diaria = ultimoAte(fu?.d || [], d), mensal = ultimoAte(fu?.m || [], somaDias(d.slice(0, 7) + "-01", -1).slice(0, 7));
      const cota = (diaria && diaria[0] <= d && fu.d[0][0] <= d ? diaria[1] : null) ?? mensal?.[1] ?? fu?.d?.at(-1)?.[1];
      if (!(cotas > 0)) { if (!cota) return erro("Não achei a cota desse fundo. Coloque a quantidade de cotas"); cotas = aplicado / cota; }

      const m = D.cr?.moedas?.find((x) => `${x[1]} · ${x[2]}` === txt) || D.cr?.moedas?.find((x) => x[1] === sim || x[2].toLowerCase() === txt.toLowerCase());
      if (!m) return erro("Escolha a moeda na lista");
      const qtd = n("qtd");
      if (!(qtd > 0)) return erro("Coloque a quantidade");
      Object.assign(novo, { moeda: m[0], simbolo: m[1], nome: m[2], qtd, aplicado: n("aplicado") });
    } else {
      const valor = n("valor");
      if (!(valor >= 0)) return erro("Coloque o valor de hoje");
      Object.assign(novo, { tipo: f.tipo.value, nome: f.nome.value.trim(), valor, atualizado: hojeISO() });
    }
    const lista = consItens(), k = lista.findIndex((x) => x.id === novo.id);
    if (k >= 0) lista[k] = novo; else lista.push(novo);
    salvar(); aviso(k >= 0 ? "Investimento salvo" : "Investimento adicionado"); render();
  };
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  $("input, select", f)?.focus({ preventScroll: true });
}

function ligarBuscaFundo(f) {

  };

  q.oninput = async () => {
    f.cnpj.value = "";

/* ---------- gráfico de várias linhas (comparador e indicadores) ---------- */
const CORES_SERIES = ["var(--verde)", "#C9971C", "#2F6FB3", "#C2453D", "#7B57B8"];
function graficoMulti(el, series, { altura = 300, formato = (v) => pct(v, 1, true) } = {}) {
  el.innerHTML = "";
  series = series.filter((s) => s.pontos.length >= 2);
  if (!series.length) { el.innerHTML = `<p class="fraco">Sem dados suficientes para o gráfico.</p>`; return; }
  const L = Math.max(el.clientWidth, 320), A = altura, m = { e: 8, d: 64, t: 12, b: 26 };
  const vals = series.flatMap((s) => s.pontos.map((p) => p.v));
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08; min -= pad; max += pad;
  const t0 = Math.min(...series.map((s) => Date.parse(s.pontos[0].d))), t1 = Math.max(...series.map((s) => Date.parse(s.pontos.at(-1).d)));
  const X = (d) => m.e + ((Date.parse(d) - t0) / Math.max(t1 - t0, 1)) * (L - m.e - m.d);
  const Y = (v) => m.t + (1 - (v - min) / (max - min)) * (A - m.t - m.b);
  let grade = "";
  for (let k = 0; k <= 4; k++) {
    const v = min + ((max - min) / 4) * k, y = Y(v);
    grade += `<line x1="${m.e}" x2="${L - m.d}" y1="${y}" y2="${y}" stroke="var(--linha-2)"/><text x="${L - m.d + 8}" y="${y + 4}" font-size="11.5" fill="var(--tinta-3)">${esc(formato(v))}</text>`;
  }
  const nEixo = L < 420 ? 2 : L < 640 ? 3 : 4;   // datas sem encavalar em tela pequena
  const datasEixo = [...Array(nEixo).keys()].map((k) => new Date(t0 + (k / (nEixo - 1)) * (t1 - t0)).toISOString().slice(0, 10));
  const eixo = datasEixo.map((d, k) => `<text x="${X(d)}" y="${A - 6}" font-size="11.5" fill="var(--tinta-3)" text-anchor="${k === 0 ? "start" : k === nEixo - 1 ? "end" : "middle"}">${dataBR(d)}</text>`).join("");
  const linhas = series.map((s, i) => `<path d="${s.pontos.map((p, k) => (k ? "L" : "M") + X(p.d).toFixed(1) + " " + Y(p.v).toFixed(1)).join("")}" fill="none" stroke="${s.cor || CORES_SERIES[i % 5]}" stroke-width="2"${s.tracejado ? ' stroke-dasharray="5 4"' : ""}/>`).join("");
  el.innerHTML = `<div class="legenda-multi">${series.map((s, i) => `<span><i style="background:${s.cor || CORES_SERIES[i % 5]}"></i>${esc(s.nome)}</span>`).join("")}</div>
    <svg viewBox="0 0 ${L} ${A}" height="${A}" role="img" aria-label="Gráfico comparando ${esc(series.map((s) => s.nome).join(", "))}">
      ${min < 0 && max > 0 ? `<line x1="${m.e}" x2="${L - m.d}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tinta-3)" stroke-width="1" opacity=".5"/>` : ""}
      ${grade}${eixo}${linhas}
      <line class="mira" y1="${m.t}" y2="${A - m.b}" stroke="var(--tinta-3)" opacity="0"/>
      <rect x="${m.e}" y="0" width="${L - m.e - m.d}" height="${A}" fill="transparent"/>
    </svg><div class="dica oculto"></div>`;
  const svg = $("svg", el), dica = $(".dica", el), mira = $(".mira", el);
  const valorEm = (s, alvo) => {   // último ponto da série até a data
    let lo = 0, hi = s.pontos.length - 1;
    if (Date.parse(s.pontos[0].d) > alvo) return null;
    while (lo < hi) { const md = (lo + hi + 1) >> 1; if (Date.parse(s.pontos[md].d) <= alvo) lo = md; else hi = md - 1; }
    return s.pontos[lo];
  };
  svg.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (L / r.width);
    const alvo = t0 + ((x - m.e) / (L - m.e - m.d)) * (t1 - t0);
    const pts = series.map((s) => [s, valorEm(s, alvo)]).filter(([, p]) => p);
    if (!pts.length) return;
    const d = pts[0][1].d;
    mira.setAttribute("x1", X(d)); mira.setAttribute("x2", X(d)); mira.setAttribute("opacity", 1);
    dica.innerHTML = `${dataBR(d)}<br>${pts.map(([s, p], i) => `<span style="color:${s.cor || CORES_SERIES[series.indexOf(s) % 5]}">●</span> ${esc(s.nome)} <b>${esc(formato(p.v))}</b>`).join("<br>")}`;
    dica.style.left = (X(d) * r.width / L) + "px"; dica.style.top = "30px";
    dica.classList.remove("oculto");
  });
  svg.addEventListener("mouseleave", () => { dica.classList.add("oculto"); mira.setAttribute("opacity", 0); });
}

const LINHAS_COMPARAR = [
  // chave, nome, formato, direção do destaque (1 maior, -1 menor, 0 sem), para quem (acao, fii ou ambos)
  ["setor", "Setor ou segmento", (v) => esc(v ?? "–"), 0, "ambos"],
  ["preco", "Cotação", brl, 0, "ambos"],
  ["var_30d", "Variação em 30 dias", (v) => `<span class="${cls(v)}">${pct(v, 1, true)}</span>`, 0, "ambos"],
  ["var_12m", "Variação em 12 meses", (v) => `<span class="${cls(v)}">${pct(v, 1, true)}</span>`, 0, "ambos"],
  ["dy", "Dividend yield (12 meses)", pct, 1, "ambos"],
  ["pl", "P/L", xv, -1, "acao"],
  ["pvp", "P/VP", xv, -1, "ambos"],
  ["roe", "ROE", pct, 1, "acao"],
  ["m_liq", "Margem líquida", pct, 1, "acao"],
  ["roic", "ROIC", pct, 1, "acao"],
  ["dl_ebitda", "Dívida líquida / EBITDA", xv, -1, "acao"],
  ["cagr_rec", "Crescimento da receita (5 anos, por ano)", (v) => pct(v, 1, true), 1, "acao"],
  ["cagr_luc", "Crescimento do lucro (5 anos, por ano)", (v) => pct(v, 1, true), 1, "acao"],
  ["liq_corr", "Liquidez corrente", xv, 1, "acao"],
  ["lucro", "Lucro (12 meses)", compacto, 0, "acao"],
  ["vm", "Valor de mercado", compacto, 0, "acao"],
  ["graham", "Preço justo de Graham", null, 0, "acao"],
  ["bazin", "Preço teto de Bazin (6%)", null, 0, "acao"],
  ["pontos", "Nota buy and hold", (v) => vazio(v) ? "–" : v + "/8", 1, "acao"],
  ["vp", "Valor patrimonial por cota", brl, 0, "fii"],
  ["magic", "Magic number", (v) => vazio(v) ? "–" : F.n0.format(v), 0, "fii"],
  ["liq", "Liquidez diária", compacto, 1, "ambos"],
];
rotas.comparar = async (el, arg = "") => {
  const sel = [...new Set(String(arg).toUpperCase().split(",").map((t) => t.trim()).filter((t) => S.porTicker[t]))].slice(0, 5);
  const irPara = (lista) => ir("#comparar" + (lista.length ? "-" + lista.join(",") : ""));
  const ativos = sel.map((t) => S.porTicker[t]);
  const sugestao = S.ativos.filter((a) => a.tipo === "acao").slice(0, 3).map((a) => a.t);
  el.innerHTML = `<div class="cabeca"><div><h1>Comparar ativos</h1><p class="sutil" style="margin:6px 0 0">Até 5 ações ou FIIs lado a lado. Em cada linha, o destaque marca o maior ou o menor valor, conforme o indicador.</p></div></div>
    <div class="painel cmp-escolha">
      <form id="cmp-add" class="cmp-form">
        <label class="campo" style="flex:1">Adicionar ativo<input type="text" id="cmp-campo" list="cmp-lista" placeholder="Digite o código, como PETR4 ou MXRF11" autocomplete="off" ${sel.length >= 5 ? "disabled" : ""}></label>
        <button class="btn primario" ${sel.length >= 5 ? "disabled" : ""}>Adicionar</button>
      </form>
      <datalist id="cmp-lista">${S.ativos.map((a) => `<option value="${a.t}">${esc(a.n)}</option>`).join("")}</datalist>
      <div class="chips">${sel.map((t, i) => `<span class="chip cmp-chip"><i style="background:${CORES_SERIES[i]}"></i>${t}<button type="button" data-tira="${t}" aria-label="Tirar ${t} da comparação">×</button></span>`).join("")}
        ${sel.length >= 5 ? `<span class="fraco">Máximo de 5 ativos.</span>` : ""}</div>
    </div>
    ${!sel.length ? `<div class="painel vazio"><h3>Escolha os ativos para comparar</h3><p>Digite o código acima, ou abra a página de um ativo e toque em "Comparar com o setor".</p>
        <div class="acoes"><button class="btn" id="cmp-exemplo">Comparar ${sugestao.join(", ")}</button></div></div>` : `
    <div class="painel"><h2>Indicadores</h2><div class="rolagem"><table class="cmp-tabela"><thead><tr><th class="esq">Indicador</th>
      ${ativos.map((a, i) => `<th><a class="tk" href="#ativo-${a.t}"><i class="ponto-cor" style="background:${CORES_SERIES[i]}"></i>${a.t}</a><small>${esc(a.n)}</small></th>`).join("")}</tr></thead>
      <tbody>${LINHAS_COMPARAR.filter(([, , , , para]) => para === "ambos" || ativos.some((a) => a.tipo === para)).map(([k, nome, f, dir, para]) => {
        const vale = (a) => para === "ambos" || a.tipo === para;
        const valores = ativos.map((a) => (vale(a) ? a[k] : null));
        let alvo = null;
        if (dir) {
          const nums = valores.map((v, i) => [v, i]).filter(([v]) => typeof v === "number" && !vazio(v) && (dir > 0 || v > 0));
          if (nums.length >= 2) alvo = nums.reduce((b, c) => (dir > 0 ? c[0] > b[0] : c[0] < b[0]) ? c : b)[1];
        }
        const cel = (v, i) => {
          const a = ativos[i];
          if (!vale(a)) return "–";
          if (k === "graham" || k === "bazin") return vazio(v) ? "–" : `${brl(v)}<small class="${cls(v / a.preco - 1)}">${pct(v / a.preco - 1, 0, true)} da cotação</small>`;
          return f(v);

        return `<tr><td class="esq">${nome}</td>${valores.map((v, i) => `<td class="${i === alvo ? "destaque" : ""}">${cel(v, i)}</td>`).join("")}</tr>`;

    <div class="painel"><h2>Variação da cotação em 12 meses</h2><div class="grafico" id="g-cmp"><p class="fraco">Carregando…</p></div></div>`}`;
  $("#cmp-add").onsubmit = (e) => {

    } catch (e) { return { nome: t, cor: CORES_SERIES[i], pontos: [] }; }

  if ($("#g-cmp")) graficoMulti($("#g-cmp"), series);
};

/* ---------- tela: imposto de renda (Ouro) ---------- */
// Regras de 2026: ações 15% com isenção para vendas de até R$ 20 mil no mês; ETFs e BDRs 15% sem isenção;
// FIIs e Fiagros 20% sem isenção; DARF 6015 até o último dia útil do mês seguinte, mínimo de R$ 10.
const IR_FICHA = {
  acao: ["03", "01", "Ações"], bdr: ["04", "04", "Ativos negociados em bolsa no Brasil (BDRs)"],
  fii: ["07", "03", "Fundo de Investimento Imobiliário (FII)"], fiagro: ["07", "02", "Fiagro"], etf: ["07", "09", "Fundos de índice (ETFs)"],
};
const UIR = { ano: null, aba: "mensal", carteira: "todas" };
const tipoIR = (t) => S.porTicker[t]?.tipo || "acao";
const MESES_IR = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function ultimoDiaUtil(ano, mes) { // mes de 1 a 12; não desconta feriados
  const d = new Date(Date.UTC(ano, mes, 0));
  while (d.getUTCDay() === 0 || d.getUTCDay() === 6) d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString().slice(0, 10);
}
function carteiraIR() {
  if (UIR.carteira !== "todas") { const c = S.estado.carteiras.find((x) => x.id === UIR.carteira); if (c) return c; UIR.carteira = "todas"; }
  return { nome: "Todas as carteiras", lancamentos: S.estado.carteiras.flatMap((c) => c.lancamentos) };
}
// vendas com o lucro pelo preço médio e a posição (quantidade e custo) em cada fim de ano
function replayIR(c) {
  const pos = {}, vendas = [], fimAno = {};
  const lanc = ordenados(c);
  const compras = new Set(lanc.filter((l) => l.tipo === "C").map((l) => l.ticker + "|" + l.data));
  let anoAtual = lanc[0] ? +lanc[0].data.slice(0, 4) : null;
  const fechar = (ate) => { while (anoAtual !== null && anoAtual < ate) { fimAno[anoAtual] = JSON.parse(JSON.stringify(pos)); anoAtual++; } };
  for (const l of lanc) {
    fechar(+l.data.slice(0, 4));
    const p = pos[l.ticker] ??= { qtd: 0, custo: 0 };
    if (l.tipo === "C" || l.tipo === "B") { p.custo += l.qtd * (l.preco || 0); p.qtd += l.qtd; }
    else if (l.tipo === "G") { p.qtd = Math.max(p.qtd - l.qtd, 0); if (!p.qtd) p.custo = 0; }
    else {
      const pm = p.qtd ? p.custo / p.qtd : 0, q = Math.min(l.qtd, p.qtd);
      vendas.push({ data: l.data, ticker: l.ticker, qtd: q, valor: q * l.preco, lucro: q * (l.preco - pm), mesmoDia: compras.has(l.ticker + "|" + l.data) });
      p.custo -= q * pm; p.qtd = Math.round((p.qtd - q) * 1e6) / 1e6;
    }
  }
  fechar(new Date().getFullYear() + 1);
  return { vendas, fimAno };
}
function apuracaoIR(c, ano) {
  const { vendas } = replayIR(c);
  const primeiro = vendas.length ? +vendas[0].data.slice(0, 4) : ano;
  let prejC = 0, prejF = 0, pendente = 0, saida = [];
  for (let a = Math.min(primeiro, ano); a <= ano; a++) for (let m = 1; m <= 12; m++) {
    const chave = `${a}-${String(m).padStart(2, "0")}`;
    const vs = vendas.filter((v) => v.data.startsWith(chave));
    const soma = (f) => vs.filter(f).reduce((s, v) => s + v.lucro, 0);
    const vAcoes = vs.filter((v) => tipoIR(v.ticker) === "acao").reduce((s, v) => s + v.valor, 0);
    const lAcoes = soma((v) => tipoIR(v.ticker) === "acao");
    const lOutros = soma((v) => ["etf", "bdr"].includes(tipoIR(v.ticker)));
    const lFundos = soma((v) => ehFundo(tipoIR(v.ticker)));
    const isento = vAcoes <= 20000, ganhoIsento = isento && lAcoes > 0 ? lAcoes : 0;
    let baseC = (isento ? Math.min(lAcoes, 0) : lAcoes) + lOutros, baseF = lFundos;
    const compC = baseC > 0 ? Math.min(baseC, prejC) : 0, compF = baseF > 0 ? Math.min(baseF, prejF) : 0;
    if (baseC > 0) { baseC -= compC; prejC -= compC; } else { prejC -= baseC; baseC = 0; }
    if (baseF > 0) { baseF -= compF; prejF -= compF; } else { prejF -= baseF; baseF = 0; }
    const devido = baseC * 0.15 + baseF * 0.2, total = devido + pendente;
    let darf = 0;
    if (total >= 10) { darf = total; pendente = 0; } else pendente = total;
    const venc = m === 12 ? ultimoDiaUtil(a + 1, 1) : ultimoDiaUtil(a, m + 1);
    if (a === ano) saida.push({ mes: m, chave, n: vs.length, vAcoes, lAcoes, lOutros, lFundos, isento, ganhoIsento, compC, compF, baseC, baseF,
      devido, darf, pendente, venc, prejC, prejF, mesmoDia: vs.some((v) => v.mesmoDia) });
  }
  return saida;
}
async function bensIR(c, ano) {
  const { fimAno } = replayIR(c);
  const agora = fimAno[ano] || {}, antes = fimAno[ano - 1] || {};
  const tickers = [...new Set([...Object.keys(agora), ...Object.keys(antes)])].filter((t) => (agora[t]?.qtd || 0) > 0 || (antes[t]?.qtd || 0) > 0).sort();
  const linhas = [];
  for (const t of tickers) {
    let d = null; try { d = await detalhe(t); } catch (e) { /* fora da base */ }
    const tipo = d?.tipo || tipoIR(t), ficha = IR_FICHA[tipo] || IR_FICHA.acao, a = agora[t] || { qtd: 0, custo: 0 };
    const cnpj = d?.cnpj || d?.fundo?.cnpj || "";
    const nome = d?.nome || S.porTicker[t]?.n || t;
    const texto = a.qtd > 0
      ? `${qtdF(a.qtd)} ${classe(tipo).unidade} de ${t} (${nome})${cnpj ? ", CNPJ " + cnpj : ""}, ao preço médio de ${brl(a.custo / a.qtd)}.`
      : `${t} (${nome})${cnpj ? ", CNPJ " + cnpj : ""}: posição zerada em ${ano}.`;
    linhas.push({ t, tipo, ficha, cnpj, nome, texto, antes: antes[t]?.qtd > 0 ? antes[t].custo : 0, agora: a.qtd > 0 ? a.custo : 0 });
  }
  return linhas;
}
async function rendimentosIR(c, ano) {
  const provs = (await proventosDaCarteira(c)).filter((p) => p.recebido && (p.pagamento || "").startsWith(String(ano)));
  const grupos = {};
  for (const p of provs) {
    const tipo = tipoIR(p.ticker), jcp = /jcp|juros/i.test(p.tipo || "");

  f.querySelectorAll("input[name=tipo]").forEach((r) => r.onchange = () => { msg.placeholder = REC_DICA[r.value]; if (r.value === "dado" && !f.pagina.value) f.pagina.value = "ativo"; });
  msg.oninput = () => { $("#rec-cont").textContent = `${msg.value.length} de 4000`; };
  $("#rec-arquivo").onchange = async (e) => {
    const arq = e.target.files[0]; if (!arq) return;
    if (arq.size > 20e6) { aviso("Esse arquivo é grande demais. Escolha uma imagem de até 20 MB."); return; }
    try {
      print = await printReclamacao(arq);
      $("#rec-print-info").innerHTML = `<img alt="" src="${URL.createObjectURL(print)}"> ${esc(arq.name)} <button type="button" class="btn texto" id="rec-print-tirar">Tirar</button>`;
      $("#rec-print-tirar").onclick = () => { print = null; $("#rec-arquivo").value = ""; $("#rec-print-info").textContent = "Opcional, ajuda muito a achar o problema."; };
    } catch (err) { aviso("Não deu para ler essa imagem. Tente outra."); }
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const dados = { tipo: f.tipo.value, pagina: f.pagina.value || null, ativo: f.ativo.value.trim().toUpperCase() || null,
      mensagem: msg.value.trim(), contato: f.contato.value.trim() || null, navegador: navigator.userAgent.slice(0, 300) };
    if (dados.mensagem.length < 5) { aviso("Escreva um pouco mais sobre o que aconteceu."); msg.focus(); return; }
    if (/\b(?:\d[ -]?){13,19}\b/.test(dados.mensagem)) { aviso("Parece que tem um número de cartão na mensagem. Tire antes de enviar."); msg.focus(); return; }
    if (!S.nuvem || !S.usuario) {
      if (!VENDEDOR.email) { aviso("Entre na sua conta para enviar."); return; }
      location.href = `mailto:${VENDEDOR.email}?subject=${encodeURIComponent("Milhão: " + (REC_TIPOS.find((t) => t[0] === dados.tipo) || [])[1])}&body=${encodeURIComponent(dados.mensagem + (dados.ativo ? "\n\nAtivo: " + dados.ativo : ""))}`;
      return;
    }
    const b = $("#rec-enviar"); b.disabled = true; b.textContent = "Enviando…";
    try {
      if (print) {
        const caminho = `${S.usuario.id}/${Date.now()}.jpg`;
        const { error } = await S.nuvem.storage.from("reclamacoes").upload(caminho, print, { contentType: "image/jpeg" });
        if (!error) dados.print = caminho;
      }
      const { data, error } = await S.nuvem.from("reclamacoes").insert(dados).select("protocolo").single();
      if (error) throw error;
      $("#rec-caixa").innerHTML = `<div class="rec-feito"><span class="sutil">Recebemos a sua mensagem</span><strong>Protocolo #${esc(data.protocolo)}</strong>
        <p class="sutil" style="max-width:420px;margin:0 auto 14px">Ela vai ser lida pelo criador do Milhão. A resposta aparece em "Minhas mensagens".</p>
        <button class="btn" id="rec-outra">Enviar outra</button></div>`;
      $("#rec-outra").onclick = () => rotas.reclame(el, "");
      carregarMinhas();
    } catch (err) {
      console.warn(err);
      aviso(String(err?.message || "").includes("limite_diario") ? "Você já mandou 10 mensagens hoje. Tente de novo amanhã." : "Não deu para enviar agora. Tente de novo em instantes.");
      b.disabled = false; b.textContent = "Enviar";
    }
  };
  const ligarPrints = (raiz) => raiz.querySelectorAll("[data-print]").forEach((bt) => bt.onclick = async () => {
    const { data } = await S.nuvem.storage.from("reclamacoes").createSignedUrl(bt.dataset.print, 600);
    if (data?.signedUrl) window.open(data.signedUrl, "_blank", "noopener");
  });
  async function carregarMinhas() {
    const box = $("#rec-minhas"); if (!box) return;
    if (!S.nuvem || !S.usuario) { box.innerHTML = `<p class="sutil" style="margin:0">Entre na sua conta para acompanhar as respostas.</p>`; return; }
    const { data, error } = await S.nuvem.from("reclamacoes").select("*").eq("user_id", S.usuario.id).order("criado_em", { ascending: false }).limit(30);
    if (error) { box.innerHTML = `<p class="sutil" style="margin:0">Não deu para carregar agora.</p>`; return; }
    box.innerHTML = data.length ? data.map((r) => itemReclamacao(r)).join("") : `<p class="sutil" style="margin:0">Você ainda não mandou nenhuma. Quando mandar, ela aparece aqui com a resposta.</p>`;
    ligarPrints(box);
  }
  carregarMinhas();
  if (S.nuvem && S.usuario && ehCriadorMilhao()) {
    $("#rec-painel-dono").classList.remove("oculto");
    let filtro = "aberta";
    const carregarTodas = async () => {
      let q = S.nuvem.from("reclamacoes").select("*").order("criado_em", { ascending: false }).limit(200);
      if (filtro !== "todas") q = q.eq("status", filtro);
      const { data, error } = await q, box = $("#rec-todas");
      if (error) { box.innerHTML = `<p class="sutil">Não deu para carregar.</p>`; return; }
      box.innerHTML = data.length ? data.map((r) => itemReclamacao(r, true)).join("") : `<p class="sutil" style="margin:0">Nenhuma por aqui.</p>`;
      ligarPrints(box);
      box.querySelectorAll("[data-salvar]").forEach((bt) => bt.onclick = async () => {
        const art = bt.closest("[data-rec]"), resposta = art.querySelector("[data-resp]").value.trim(), status = art.querySelector("[data-st]").value;
        const { error } = await S.nuvem.from("reclamacoes").update({ resposta: resposta || null, status, respondido_em: resposta ? new Date().toISOString() : null }).eq("id", art.dataset.rec);
        aviso(error ? "Não deu para salvar." : "Resposta salva."); if (!error) carregarTodas();
      });
    };
    $$("[data-rf]").forEach((bt) => bt.onclick = () => { filtro = bt.dataset.rf; $$("[data-rf]").forEach((x) => x.setAttribute("aria-pressed", x === bt)); carregarTodas(); });
    carregarTodas();
  }
};

const COM_TEMAS = [["acoes", "Ações"], ["fiis", "FIIs"], ["renda_fixa", "Renda fixa"], ["cripto", "Cripto"], ["estrategia", "Estratégia"], ["iniciantes", "Começando"], ["geral", "Papo geral"]];

const ICO_FALA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>';

const COM_CORES = ["#0B6E4F", "#2C6E8A", "#7A5410", "#6B4C9A", "#A23B4B", "#3D6B2A", "#8A4F1D", "#245C73"];
function avatarCom(autor, tam = 36) {
  const ap = autor?.apelido || "?";
  if (autor?.foto) return `<img class="avatar av-com" src="${esc(autor.foto)}" alt="" width="${tam}" height="${tam}" style="--tam:${tam}px" loading="lazy">`;
  let h = 0; for (const c of ap) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="avatar iniciais av-com" style="--tam:${tam}px;background:${COM_CORES[h % COM_CORES.length]};color:#fff" aria-hidden="true">${esc(ap.slice(0, 2).toUpperCase())}</span>`;
}
function quando(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  if (s < 172800) return "ontem";
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
}
const dataHora = (iso) => { const d = new Date(iso); return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
// texto do usuário: escapado, e os códigos de ativo viram link para a página do ativo
const textoCom = (t) => esc(t).replace(/\b([A-Z]{4}\d{1,2})\b/g, (m) => S.porTicker?.[m] ? `<a href="#ativo-${m}">${m}</a>` : m);
// nada de cartão, CPF ou telefone em texto público
function dadoSensivel(t) {
  if (/\b(?:\d[ -]?){13,19}\b/.test(t)) return "Parece que tem um número de cartão no texto. Tire antes de publicar.";
  if (/\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/.test(t)) return "Parece que tem um CPF no texto. Tire antes de publicar.";
  if (/(?:\(?\d{2}\)?\s?)9\d{4}[-\s]?\d{4}\b/.test(t)) return "Parece que tem um número de telefone no texto. Combine contato fora da Comunidade.";
  return "";
}
const erroCom = (err) => {
  const m = String(err?.message || err || "");
  if (m.includes("limite_diario")) return "Você chegou ao limite de hoje. Tente de novo amanhã.";
  if (m.includes("comunidade_apelido_unico") || m.includes("duplicate")) return "Esse nome já está em uso. Escolha outro.";
  if (m.includes("row-level security")) return "Sua conta não pode publicar na Comunidade agora.";
  return "Não deu para salvar agora. Tente de novo em instantes.";
};

const podeComunidade = () => ehOuro() || ehCriadorMilhao();
const sugestaoApelido = () => _semAcento((S.estado?.perfil?.nome || "").split(/\s+/)[0] || "investidor").replace(/[^a-z0-9]/g, "").slice(0, 14) + "_" + Math.floor(10 + Math.random() * 89);
const regrasCom = () => `<ul class="com-regras"><li>Respeito sempre. Discorde da ideia, nunca da pessoa.</li><li>Aqui é opinião de investidor para investidor, não recomendação de compra ou venda.</li>

function dlgDenuncia() {

      <label class="campo">Detalhe, se quiser<textarea name="detalhe" maxlength="500" style="min-height:70px;font:inherit;border:1px solid var(--linha);border-radius:8px;padding:8px 10px;background:var(--branco);color:var(--tinta)"></textarea></label>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" value="cancelar">Cancelar</button><button class="btn primario" value="ok">Enviar denúncia</button></div></form>`;

}

rotas.comunidade = async (el, arg = "") => {
  const a = String(arg || "");
  const cab = (extra = "") => `<div class="cabeca"><div><h1>Comunidade</h1><p class="sutil" style="margin:6px 0 0">Debata com outros investidores do Milhão Ouro: carteira, dividendos, estratégia e o que mais aparecer.</p></div>${extra}</div>`;
  if (!S.nuvem || !S.usuario) {
    el.innerHTML = cab() + `<div class="painel vazio"><h3>Entre na sua conta</h3><p>A Comunidade precisa de uma conta do Milhão, para cada pessoa ter o seu nome de perfil.</p></div>`;
    return;
  }
  // plano Grátis: prévia borrada e o convite

    el.innerHTML = cab() + `<div class="com-trava"><div class="com-lista" aria-hidden="true">${COM_EXEMPLOS.map(([ap, tema, ativo, titulo, texto, n], i) =>
        itemTopico({ id: "x" + i, autor: { apelido: ap }, tema, ativo, titulo, texto, respostas: n, atividade_em: new Date(Date.now() - (i + 1) * 5400e3).toISOString() })).join("").replace(/<a /g, "<div ").replace(/<\/a>/g, "</div>")}</div>
      <div class="com-convite"><div class="painel"><h2>${ICO_CADEADO} A Comunidade é do Milhão Ouro</h2>
        <ul class="ir-lista"><li>Crie o seu nome de perfil e debata com outros investidores</li><li>Abra tópicos sobre um ativo, uma estratégia ou uma dúvida</li><li>Moderação do próprio Milhão, sem propaganda e sem golpe</li></ul>
        <div class="acoes" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn dourado" id="com-ouro">Conhecer o Milhão Ouro</button><span class="fraco">${brl(PLANO_OURO.preco)} por mês, cancele quando quiser.</span></div></div></div></div>`;
    $("#com-ouro").onclick = () => ir("#perfil");
    return;
  }
  el.innerHTML = cab() + `<p class="fraco">Carregando…</p>`;
  let eu;
  try { eu = await meuPerfilCom(); } catch (err) {
    console.warn(err);
    el.innerHTML = cab() + `<div class="painel vazio"><h3>A Comunidade não abriu agora</h3><p>Tente de novo em instantes.</p></div>`;

  if (!location.hash.startsWith("#comunidade")) return;
  if (!eu) return telaPerfilCom(el, cab, a);
  if (a.startsWith("t-")) return telaTopico(el, eu, a.slice(2));
  return telaListaCom(el, eu, cab, a);
};

/* primeira vez: escolher o nome de perfil */
function telaPerfilCom(el, cab, arg, atual = null) {
  const foto = fotoPerfil();
  el.innerHTML = cab() + `<div class="com-grade"><section class="painel"><form class="com-form" id="com-perfil" novalidate>
      <h2 style="margin:0">${atual ? "Trocar o seu nome de perfil" : "Escolha o seu nome de perfil"}</h2>
      <p class="sutil" style="margin:0">É assim que os outros vão te ver nos tópicos e respostas. Seu nome e e-mail da conta não aparecem.</p>
      <label class="campo">Nome de perfil<div class="com-arroba"><span>@</span><input type="text" name="apelido" maxlength="20" autocomplete="off" spellcheck="false" value="${esc(atual?.apelido || sugestaoApelido())}"></div>
        <small class="fraco">De 3 a 20 letras, números, _ ou ponto. Sem espaço e sem acento.</small></label>
      ${foto ? `<label class="imp-check"><input type="checkbox" name="foto"${!atual || atual.foto ? " checked" : ""}><span>Mostrar a minha foto do Milhão</span></label>` : ""}
      ${atual ? "" : `<label class="imp-check"><input type="checkbox" name="regras"><span>Li e sigo as regras da Comunidade.</span></label>`}
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primario" type="submit" id="com-perfil-ok">${atual ? "Salvar" : "Entrar na Comunidade"}</button>${atual ? `<button class="btn" type="button" id="com-perfil-volta">Cancelar</button>` : ""}</div>
    </form></section><aside class="com-lado"><section class="painel"><h2>Regras da Comunidade</h2>${regrasCom()}</section></aside></div>`;
  const f = $("#com-perfil");
  f.apelido.oninput = () => { const p = f.apelido.selectionStart; f.apelido.value = _semAcento(f.apelido.value).replace(/[^A-Za-z0-9_.]/g, ""); f.apelido.setSelectionRange(p, p); };
  if ($("#com-perfil-volta")) $("#com-perfil-volta").onclick = () => rotas.comunidade(el, arg);
  f.onsubmit = async (e) => {
    e.preventDefault();
    const apelido = f.apelido.value.trim();
    if (!/^[A-Za-z0-9_.]{3,20}$/.test(apelido)) { aviso("Use de 3 a 20 letras, números, _ ou ponto."); f.apelido.focus(); return; }
    if (!atual && !f.regras.checked) { aviso("Marque que você leu as regras da Comunidade."); return; }
    const dados = { apelido, foto: foto && f.foto?.checked ? foto.split("?")[0] : null };
    const b = $("#com-perfil-ok"); b.disabled = true;
    const q = atual ? S.nuvem.from("comunidade_perfis").update(dados).eq("user_id", S.usuario.id) : S.nuvem.from("comunidade_perfis").insert(dados);
    const { error } = await q;
    b.disabled = false;
    if (error) { aviso(erroCom(error)); return; }
    S._perfilCom = null;
    aviso(atual ? "Nome de perfil salvo." : `Bem-vindo à Comunidade, @${apelido}!`);
    rotas.comunidade(el, arg);
  };
}

/* lista de tópicos */
async function telaListaCom(el, eu, cab, arg) {
  let tema = "", ativo = "", pagina = 0;
  if (arg.startsWith("ativo-")) ativo = decodeURIComponent(arg.slice(6)).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  if (arg.startsWith("tema-") && COM_TEMAS.some((t) => t[0] === arg.slice(5))) tema = arg.slice(5);
  const dono = ehCriadorMilhao();
  el.innerHTML = cab(`<div class="acoes"><button class="btn primario" id="com-novo">Novo tópico</button></div>`) + `<div class="com-grade">
    <div><div id="com-form-novo"></div>
      <div class="com-barra"><div class="chips" role="group" aria-label="Assunto"><button class="chip" data-tema="" aria-pressed="${!tema}">Todos</button>${COM_TEMAS.map(([k, n]) => `<button class="chip" data-tema="${k}" aria-pressed="${tema === k}">${n}</button>`).join("")}</div>
        <input type="search" id="com-ativo" placeholder="Ativo" aria-label="Filtrar por ativo" maxlength="8" value="${esc(ativo)}"></div>
      <div class="com-lista" id="com-lista"><p class="fraco">Carregando…</p></div>
      <div style="text-align:center;margin-top:12px"><button class="btn oculto" id="com-mais">Ver mais tópicos</button></div></div>
    <aside class="com-lado">
      <section class="painel"><div class="com-eu">${avatarCom(eu, 40)}<div><b>@${esc(eu.apelido)}</b><button class="btn texto" style="padding:0;font-size:13px" id="com-trocar">Trocar nome de perfil</button></div></div>
        ${eu.bloqueado ? `<p class="fraco" style="margin:10px 0 0">Sua conta foi bloqueada pela moderação: você ainda lê, mas não publica.</p>` : ""}</section>
      <section class="painel"><h2>Regras da Comunidade</h2>${regrasCom()}</section>
      ${dono ? `<section class="painel"><h2>Denúncias abertas</h2><div id="com-denuncias"><p class="fraco">Carregando…</p></div></section>` : ""}
    </aside></div>`;
  $("#com-trocar").onclick = () => telaPerfilCom(el, (x) => cab(x), arg, eu);
  $("#com-novo").onclick = () => formTopico($("#com-form-novo"), eu, { ativo });
  const carregar = async (mais = false) => {
    if (!mais) pagina = 0;
    let q = S.nuvem.from("comunidade_posts").select(COM_CAMPOS).order("atividade_em", { ascending: false }).range(pagina * COM_POR_PAGINA, pagina * COM_POR_PAGINA + COM_POR_PAGINA - 1);
    if (tema) q = q.eq("tema", tema);
    if (ativo) q = q.eq("ativo", ativo);
    const { data, error } = await q, box = $("#com-lista");
    if (!box) return;
    if (error) { box.innerHTML = `<p class="sutil">Não deu para carregar os tópicos. Tente de novo em instantes.</p>`; return; }
    const html = data.map(itemTopico).join("");
    if (mais) box.insertAdjacentHTML("beforeend", html);
    else box.innerHTML = html || `<div class="painel vazio"><h3>${ativo || tema ? "Nenhum tópico com esse filtro" : "Ninguém abriu um tópico ainda"}</h3><p>Que tal começar a conversa?</p>
      <div class="acoes"><button class="btn primario" id="com-novo-vazio">Abrir um tópico${ativo ? " sobre " + esc(ativo) : ""}</button></div></div>`;
    if ($("#com-novo-vazio")) $("#com-novo-vazio").onclick = () => formTopico($("#com-form-novo"), eu, { ativo, tema });
    $("#com-mais").classList.toggle("oculto", data.length < COM_POR_PAGINA);
  };
  $$("[data-tema]").forEach((b) => b.onclick = () => { tema = b.dataset.tema; $$("[data-tema]").forEach((x) => x.setAttribute("aria-pressed", x === b)); carregar(); });
  let t; $("#com-ativo").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { ativo = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); carregar(); }, 350); };
  $("#com-mais").onclick = () => { pagina++; carregar(true); };
  carregar();
  if (dono) carregarDenuncias();
}

/* formulário de tópico novo (ou edição) */
function formTopico(box, eu, ini = {}, aoSalvar = null) {
  if (eu.bloqueado) { aviso("Sua conta está bloqueada para publicar na Comunidade."); return; }
  const editando = !!ini.id;
  box.innerHTML = `<section class="painel" style="margin-bottom:14px"><form class="com-form" id="com-topico" novalidate>
      ${editando ? "" : `<h2 style="margin:0">Novo tópico</h2>`}
      <div class="linha2"><label class="campo">Assunto<select name="tema">${COM_TEMAS.map(([k, n]) => `<option value="${k}"${(ini.tema || (ini.ativo ? (S.porTicker?.[ini.ativo]?.tipo === "fii" ? "fiis" : "acoes") : "geral")) === k ? " selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="campo">Ativo, se for sobre um<input type="text" name="ativo" maxlength="8" autocomplete="off" placeholder="Ex.: PETR4" value="${esc(ini.ativo || "")}"></label></div>
      <label class="campo">Título<input type="text" name="titulo" maxlength="120" required placeholder="Ex.: Vale a pena reinvestir os dividendos de FII?" value="${esc(ini.titulo || "")}"></label>
      <label class="campo">Texto<textarea name="texto" maxlength="5000" required placeholder="Conte o contexto, os números e a sua dúvida ou opinião.">${esc(ini.texto || "")}</textarea></label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primario" type="submit" id="com-topico-ok">${editando ? "Salvar" : "Publicar"}</button><button class="btn" type="button" id="com-topico-cancela">Cancelar</button>
        <small class="fraco">Opinião não é recomendação de investimento.</small></div></form></section>`;
  const f = $("#com-topico");
  if (!editando) f.titulo.focus();
  f.ativo.oninput = () => { f.ativo.value = f.ativo.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); };
  $("#com-topico-cancela").onclick = () => { box.innerHTML = ""; if (aoSalvar) aoSalvar(null); };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const dados = { tema: f.tema.value, ativo: f.ativo.value || null, titulo: f.titulo.value.trim(), texto: f.texto.value.trim() };
    if (dados.titulo.length < 5) { aviso("Escreva um título com pelo menos 5 letras."); f.titulo.focus(); return; }
    if (!dados.texto) { aviso("Escreva o texto do tópico."); f.texto.focus(); return; }
    if (dados.ativo && !/^[A-Z0-9]{4,8}$/.test(dados.ativo)) { aviso("Confira o código do ativo, como PETR4."); f.ativo.focus(); return; }
    const sens = dadoSensivel(dados.titulo + "\n" + dados.texto); if (sens) { aviso(sens); return; }
    const b = $("#com-topico-ok"); b.disabled = true;
    const r = editando ? await S.nuvem.from("comunidade_posts").update(dados).eq("id", ini.id).select("id").single()
      : await S.nuvem.from("comunidade_posts").insert(dados).select("id").single();
    b.disabled = false;
    if (r.error) { aviso(erroCom(r.error)); return; }
    aviso(editando ? "Tópico salvo." : "Tópico publicado.");
    if (aoSalvar) aoSalvar(r.data); else ir(`#comunidade-t-${r.data.id}`);
  };
}

/* um tópico com as respostas */
async function telaTopico(el, eu, id) {
  if (!/^[0-9a-f-]{36}$/.test(id)) return ir("#comunidade");
  const dono = ehCriadorMilhao();
  el.innerHTML = `<p><a href="#comunidade" class="link-voltar">← Comunidade</a></p><p class="fraco">Carregando…</p>`;
  const [rp, rr] = await Promise.all([
    S.nuvem.from("comunidade_posts").select(COM_CAMPOS).eq("id", id).maybeSingle(),
    S.nuvem.from("comunidade_respostas").select("id,user_id,texto,criado_em,editado_em,removido,autor:comunidade_perfis(apelido,foto)").eq("post_id", id).order("criado_em").limit(500),
  ]);
  if (location.hash !== `#comunidade-t-${id}`) return;
  const p = rp.data;
  if (rp.error || !p) {
    el.innerHTML = `<p><a href="#comunidade" class="link-voltar">← Comunidade</a></p><div class="painel vazio"><h3>Esse tópico não existe mais</h3><p>Ele pode ter sido apagado pelo autor ou removido pela moderação.</p></div>`;
    return;
  }
  const resps = rr.data || [];
  const acoes = (item, tipo) => {
    const meu = item.user_id === S.usuario.id, bt = [];
    if (meu && !item.removido && !eu.bloqueado) bt.push(`<button class="btn texto" data-editar="${tipo}">Editar</button>`);
    if (meu || dono) bt.push(`<button class="btn texto" data-apagar="${tipo}">Apagar</button>`);
    if (!meu) bt.push(`<button class="btn texto" data-denunciar="${tipo}">Denunciar</button>`);
    if (dono) bt.push(`<button class="btn texto" data-moderar="${tipo}" data-acao="${item.removido ? "restaurar" : "remover"}">${item.removido ? "Restaurar" : "Remover"}</button>`,
      ...(meu ? [] : [`<button class="btn texto" data-bloquear="${esc(item.user_id)}">Bloquear @${esc(item.autor?.apelido || "")}</button>`]));
    return `<div class="com-acoes">${bt.join("")}</div>`;
  };
  const editado = (x) => x.editado_em ? ` · editado` : "";
  el.innerHTML = `<p><a href="#comunidade" class="link-voltar">← Comunidade</a></p><div class="com-grade"><div class="com-fio">
      <article class="painel${p.removido ? " com-removido" : ""}" data-item="${esc(p.id)}" data-tipo="post"><div id="com-post-corpo">
        <div class="com-meta">${avatarCom(p.autor, 32)}<b>@${esc(p.autor?.apelido || "")}</b><span>${dataHora(p.criado_em)}${editado(p)}</span><a class="com-tema" href="#comunidade-tema-${esc(p.tema)}">${esc(temaNome(p.tema))}</a>${p.ativo ? `<a class="com-ativo" href="#ativo-${esc(p.ativo)}">${esc(p.ativo)}</a>` : ""}</div>
        <h1>${esc(p.titulo)}</h1><p class="com-texto">${textoCom(p.texto)}</p>${acoes(p, "post")}</div></article>
      <section class="painel"><h2 style="margin-top:0">${resps.length === 1 ? "1 resposta" : `${resps.length} respostas`}</h2>
        <div id="com-resps">${resps.map((r) => `<div class="com-resp${r.removido ? " com-removido" : ""}" data-item="${esc(r.id)}" data-tipo="resposta">${avatarCom(r.autor)}<div>
          <div class="com-meta"><b>@${esc(r.autor?.apelido || "")}</b><span>${quando(r.criado_em)}${editado(r)}</span></div><p class="com-texto" style="font-size:14.5px">${textoCom(r.texto)}</p>${acoes(r, "resposta")}</div></div>`).join("") || `<p class="sutil" style="margin:0">Ninguém respondeu ainda. Seja o primeiro.</p>`}</div>
        ${p.removido || eu.bloqueado ? "" : `<form class="com-form" id="com-responder" style="margin-top:16px" novalidate><label class="campo">Sua resposta<textarea name="texto" maxlength="3000" placeholder="Escreva com respeito e, se puder, com números."></textarea></label>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primario" type="submit" id="com-responder-ok">Responder</button><small class="fraco">Respondendo como @${esc(eu.apelido)}</small></div></form>`}
      </section></div>
    <aside class="com-lado"><section class="painel"><h2>Regras da Comunidade</h2>${regrasCom()}</section></aside></div>`;
  const recarregar = () => telaTopico(el, eu, id);
  const itemDe = (bt) => { const art = bt.closest("[data-item]"); return { id: art.dataset.item, tipo: art.dataset.tipo, art }; };
  const tabela = (tipo) => tipo === "post" ? "comunidade_posts" : "comunidade_respostas";
  if ($("#com-responder")) $("#com-responder").onsubmit = async (e) => {
    e.preventDefault();
    const texto = e.target.texto.value.trim();
    if (!texto) { aviso("Escreva a sua resposta."); return; }
    const sens = dadoSensivel(texto); if (sens) { aviso(sens); return; }
    const b = $("#com-responder-ok"); b.disabled = true;
    const { error } = await S.nuvem.from("comunidade_respostas").insert({ post_id: id, texto });
    b.disabled = false;
    if (error) { aviso(erroCom(error)); return; }
    aviso("Resposta publicada."); recarregar();
  };
  $$("[data-editar]").forEach((bt) => bt.onclick = () => {
    const { id: iid, tipo, art } = itemDe(bt);
    if (tipo === "post") return formTopico($("#com-post-corpo"), eu, p, (ok) => recarregar());
    const r = resps.find((x) => x.id === iid), alvo = art.querySelector(".com-texto");
    alvo.outerHTML = `<form class="com-form" data-ed><textarea maxlength="3000">${esc(r.texto)}</textarea><div style="display:flex;gap:8px"><button class="btn primario" type="submit">Salvar</button><button class="btn" type="button" data-ed-cancela>Cancelar</button></div></form>`;
    bt.closest(".com-acoes").classList.add("oculto");
    const f = art.querySelector("[data-ed]");
    f.querySelector("[data-ed-cancela]").onclick = recarregar;
    f.onsubmit = async (e) => {
      e.preventDefault();
      const texto = f.querySelector("textarea").value.trim(); if (!texto) return;
      const sens = dadoSensivel(texto); if (sens) { aviso(sens); return; }
      const { error } = await S.nuvem.from("comunidade_respostas").update({ texto }).eq("id", iid);
      if (error) { aviso(erroCom(error)); return; }
      aviso("Resposta salva."); recarregar();
    };
  });
  $$("[data-apagar]").forEach((bt) => bt.onclick = async () => {
    const { id: iid, tipo } = itemDe(bt);
    const ok = await perguntar({ titulo: tipo === "post" ? "Apagar este tópico?" : "Apagar esta resposta?", texto: tipo === "post" ? "O tópico e todas as respostas somem para sempre." : "A resposta some para sempre.", botao: "Apagar", perigo: true });
    if (!ok) return;
    const { error } = await S.nuvem.from(tabela(tipo)).delete().eq("id", iid);
    if (error) { aviso(erroCom(error)); return; }
    aviso("Apagado."); if (tipo === "post") ir("#comunidade"); else recarregar();
  });
  $$("[data-denunciar]").forEach((bt) => bt.onclick = async () => {
    const { id: iid, tipo } = itemDe(bt), d = await dlgDenuncia();
    if (!d) return;
    const { error } = await S.nuvem.from("comunidade_denuncias").insert({ ...d, ...(tipo === "post" ? { post_id: iid } : { resposta_id: iid }) });
    aviso(error ? erroCom(error) : "Denúncia enviada. Obrigado por cuidar da Comunidade.");
  });
  $$("[data-moderar]").forEach((bt) => bt.onclick = async () => {
    const { id: iid, tipo } = itemDe(bt);
    const { error } = await S.nuvem.rpc("comunidade_moderar", { tipo, alvo: iid, acao: bt.dataset.acao });
    if (error) { aviso("Não deu para moderar."); return; }
    aviso(bt.dataset.acao === "remover" ? "Removido." : "Restaurado."); recarregar();
  });
  $$("[data-bloquear]").forEach((bt) => bt.onclick = async () => {
    if (!await perguntar({ titulo: "Bloquear esta pessoa?", texto: "Ela continua lendo a Comunidade, mas não publica mais tópicos nem respostas.", botao: "Bloquear", perigo: true })) return;
    const { error } = await S.nuvem.rpc("comunidade_moderar", { tipo: "perfil", alvo: bt.dataset.bloquear, acao: "bloquear" });
    aviso(error ? "Não deu para bloquear." : "Bloqueado.");
  });
}

/* painel do criador: denúncias abertas */
async function carregarDenuncias() {
  const box = $("#com-denuncias"); if (!box) return;
  const { data, error } = await S.nuvem.from("comunidade_denuncias").select("id,motivo,detalhe,criado_em,post_id,post:comunidade_posts(titulo),resposta:comunidade_respostas(post_id,texto)")
    .eq("resolvida", false).order("criado_em", { ascending: false }).limit(50);
  if (error) { box.innerHTML = `<p class="fraco">Não deu para carregar.</p>`; return; }
  box.innerHTML = data.length ? data.map((d) => {
    const pid = d.post_id || d.resposta?.post_id;
    return `<div class="rec-item" data-den="${esc(d.id)}"><div class="rec-topo"><b>${esc((COM_MOTIVOS.find((m) => m[0] === d.motivo) || [0, d.motivo])[1])}</b><span>${quando(d.criado_em)}</span></div>
      <p>${esc(d.post?.titulo || (d.resposta ? "Resposta: " + d.resposta.texto.slice(0, 90) : "Conteúdo apagado"))}</p>${d.detalhe ? `<small class="fraco">${esc(d.detalhe)}</small>` : ""}
      <div style="display:flex;gap:8px">${pid ? `<a class="btn" href="#comunidade-t-${esc(pid)}">Ver</a>` : ""}<button class="btn" data-resolver>Resolvida</button></div></div>`;
  }).join("") : `<p class="fraco" style="margin:0">Nenhuma denúncia aberta.</p>`;
  box.querySelectorAll("[data-resolver]").forEach((bt) => bt.onclick = async () => {
    const { error } = await S.nuvem.rpc("comunidade_moderar", { tipo: "denuncia", alvo: bt.closest("[data-den]").dataset.den, acao: "resolver" });
    if (!error) carregarDenuncias(); else aviso("Não deu para salvar.");
  });
}

    ? "O dado de hoje não passou na conferência e só entra no site depois de conferido. " + esc(maiuscula(c.motivo || "")) + "."
    : esc(maiuscula(c.motivo || "Um dado deste ativo está sendo conferido")) + ". Use com cuidado até a próxima atualização.";
  return `<div class="aviso-conf" role="note"><span aria-hidden="true">${ICO.alerta || "⚠"}</span><div><b>${titulo}</b>${texto} <a href="#conferencia">Como conferimos os dados</a></div></div>`;

/* ---------- referência para a evolução da carteira: o mesmo dinheiro aplicado no CDI ou num índice ---------- */
async function serieReferencia(qual) {
  if (qual === "cdi") {
    const ind = await carregarIndicadores();
    return ind?.cdi ? ind.cdi.serie : null;
  }
  const etf = ETF_REFERENCIA[qual]?.[0];
  if (!etf || !S.porTicker[etf]) return null;
  try { return (await detalhe(etf)).precos; } catch (e) { return null; }
}
function evolucaoReferencia(ev, c, serie) {
  // cada compra "aplica" o mesmo valor na referência e cada venda "resgata" o mesmo valor, na mesma data
  if (!serie?.length || !ev.length) return null;
  let k = 0, ultimo = null, cotas = 0;
  const fluxo = {};
  for (const l of c.lancamentos) if (l.tipo === "C" || l.tipo === "V") fluxo[l.data] = (fluxo[l.data] || 0) + (l.tipo === "C" ? 1 : -1) * l.qtd * l.preco;
  const datasFluxo = Object.keys(fluxo).sort();
  let f = 0;
  return ev.map((p) => {
    while (k < serie.length && serie[k][0] <= p.d) { ultimo = serie[k][1]; k++; }
    if (!ultimo) return { d: p.d, v: p.custo };
    while (f < datasFluxo.length && datasFluxo[f] <= p.d) { cotas += fluxo[datasFluxo[f]] / ultimo; f++; }
    cotas = Math.max(cotas, 0);
    return { d: p.d, v: cotas * ultimo };
  });
}

/* ---------- rentabilidade: quanto a carteira rendeu sem contar o dinheiro que entrou ou saiu (método de cotas) ---------- */
// cada dia: r = (patrimônio do dia + proventos pagos no dia) / (patrimônio da véspera + aportes do dia − vendas do dia) − 1
function rentabilidade(ev, c, provs) {
  if (!ev.length) return [];
  const datas = ev.map((p) => p.d), ok = new Set(ev.tickers || []);
  const naData = (iso) => { let lo = 0, hi = datas.length - 1; if (iso > datas[hi]) return hi; while (lo < hi) { const m = (lo + hi) >> 1; if (datas[m] < iso) lo = m + 1; else hi = m; } return lo; };
  const fluxo = new Float64Array(ev.length), prov = new Float64Array(ev.length);
  for (const l of c.lancamentos) {
    if ((l.tipo !== "C" && l.tipo !== "V") || !ok.has(l.ticker)) continue;
    // compra antes do primeiro preço conhecido conta no dia em que o ativo passa a ter preço
    const dia = ev.inicio?.[l.ticker] > l.data ? ev.inicio[l.ticker] : l.data;
    const preco = l.evento === "Ajuste pela posição da B3" && l.tipo === "V" ? (precoAtual(l.ticker) ?? l.preco) : l.preco;
    fluxo[naData(dia)] += (l.tipo === "C" ? 1 : -1) * l.qtd * (preco || 0);
  }
  for (const p of provs) if (p.recebido && ok.has(p.ticker)) prov[naData(p.pagamento)] += p.total;
  let cota = 1, antes = 0;
  return ev.map((p, i) => {
    const base = antes + fluxo[i];
    if (base > 0.01 && (antes > 0 || p.v > 0)) cota *= 1 + Math.min(Math.max((p.v + prov[i]) / base - 1, -0.95), 3);
    antes = p.v;
    return { d: p.d, cota };
  });
}
// valor da série [data, valor] no último ponto até a data
function valorAte(serie, iso, campo = 1) {
  let lo = 0, hi = serie.length - 1, r = null;
  while (lo <= hi) { const m = (lo + hi) >> 1; const d = serie[m].d ?? serie[m][0]; if (d <= iso) { r = serie[m]; lo = m + 1; } else hi = m - 1; }
  return r === null ? null : r.cota ?? r[campo];
}
const MESES_CURTOS = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
const PERIODOS_RENT = [["mes", "No mês"], ["ano", "No ano"], ["12m", "12 meses"], ["tudo", "Desde o início"]];
function inicioPeriodo(per, ultima) {
  const [a, m] = ultima.split("-").map(Number);
  if (per === "mes") return `${ultima.slice(0, 7)}-01`;
  if (per === "ano") return `${a}-01-01`;
  if (per === "12m") return `${a - 1}-${String(m).padStart(2, "0")}-${ultima.slice(8, 10)}`;
  return null;
}
// retorno de uma série no período: valor no fim / valor na véspera do início − 1
function retornoNoPeriodo(serie, de, ate) {
  if (!serie?.length) return null;
  const fim = valorAte(serie, ate); if (fim === null) return null;
  const vesp = new Date(Date.parse(de) - 864e5).toISOString().slice(0, 10);
  const ini = valorAte(serie, vesp) ?? (serie[0].cota ?? serie[0][1]);
  return ini ? fim / ini - 1 : null;
}
function mesAMes(cotas, ref) {
  const anos = {};
  let anterior = 1, refAnt = null, refBase = null;
  const meses = [...new Set(cotas.map((p) => p.d.slice(0, 7)))];
  for (const ym of meses) {
    const fim = valorAte(cotas, ym + "-31"), [a, m] = ym.split("-").map(Number);
    const linha = anos[a] ??= { carteira: Array(12).fill(null), ref: Array(12).fill(null), ini: anterior, refIni: null };
    linha.carteira[m - 1] = fim / anterior - 1;
    if (ref?.length) {
      const rf = valorAte(ref, ym + "-31"), ri = refAnt ?? valorAte(ref, new Date(Date.parse(cotas[0].d) - 864e5).toISOString().slice(0, 10)) ?? ref[0][1];
      if (rf && ri) linha.ref[m - 1] = rf / ri - 1;
      if (linha.refIni === null) linha.refIni = ri;
      if (refBase === null) refBase = ri;
      refAnt = rf;
    }
    anterior = fim;
    linha.fim = fim; linha.refFim = refAnt;
  }
  return Object.entries(anos).map(([a, l]) => ({ ano: +a, ...l, noAno: l.fim / l.ini - 1, acumulado: l.fim - 1,
    refAno: l.refIni && l.refFim ? l.refFim / l.refIni - 1 : null, refAcum: refBase && l.refFim ? l.refFim / refBase - 1 : null })).sort((x, y) => y.ano - x.ano);
}

// rentabilidade de cada ativo: valorização + lucro de vendas + proventos recebidos, sobre o que foi comprado
function rentabilidadeAtivo(c, p, provs) {
  const comprado = c.lancamentos.filter((l) => l.ticker === p.ticker && l.tipo === "C").reduce((s, l) => s + l.qtd * (l.preco || 0), 0);
  const recebido = provs.filter((x) => x.ticker === p.ticker && x.recebido).reduce((s, x) => s + x.total, 0);
  const ganho = (p.resultado || 0) + p.realizado + recebido;
  return { ganho, pct: comprado ? ganho / comprado : null, recebido };
}

  if (error) { let c = "falha"; try { c = (await error.context.json()).erro || c; } catch (e) { /* sem corpo */ } throw Object.assign(new Error(c), { codigo: c }); }
  return data;
}

/* Pix: mostra o QR Code e confere sozinho até o pagamento cair */
async function abrirPix(botao) {
  const cartao = $("#plano-cartao"), texto = botao.textContent;
  botao.disabled = true; botao.textContent = "Gerando o Pix…";
  let d;
  try { d = await chamarAssinatura("pix"); }
  catch (err) {
    botao.disabled = false; botao.textContent = texto;
    aviso({ pagamentos_em_breve: "As assinaturas abrem em breve.", ja_assinante: "Você já é Milhão Ouro." }[err.codigo] || "Não deu para gerar o Pix agora. Tente de novo em instantes.");
    return;
  }
  cartao.innerHTML = `<div class="plano-topo"><span class="selo-ouro">Pagar no Pix</span><strong>${brl(d.valor)}</strong></div>
    <p>Abra o app do seu banco, escolha <b>Pix</b> e leia o QR Code ou cole o código. O Milhão Ouro é liberado sozinho assim que o pagamento cair, por 30 dias.</p>
    <div class="pix-caixa">
      ${d.qr_base64 ? `<img src="data:image/png;base64,${esc(d.qr_base64)}" alt="QR Code do Pix de ${brl(d.valor)}" width="196" height="196">` : ""}
      <div class="pix-codigo"><label class="campo">Pix copia e cola<textarea readonly rows="4" id="pix-codigo">${esc(d.copia_e_cola)}</textarea></label>
        <button class="btn primario" id="pix-copiar">Copiar código</button></div>
    </div>
    <p class="pix-status" id="pix-status" role="status"><span class="girando" aria-hidden="true"></span>Esperando o pagamento. O código vale por 30 minutos.</p>
    <button class="btn texto" id="pix-voltar">Voltar</button>`;
  $("#pix-copiar").onclick = async () => {
    try { await navigator.clipboard.writeText(d.copia_e_cola); } catch (e) { $("#pix-codigo").select(); document.execCommand("copy"); }
    aviso("Código Pix copiado. Agora é só colar no app do banco.");
  };
  $("#pix-voltar").onclick = () => render();
  const status = $("#pix-status"), fim = Date.now() + 31 * 60e3;
  const conferir = async () => {
    if (!document.body.contains(status)) return;   // saiu da tela
    if (Date.now() > fim) { status.textContent = "Esse código expirou. Volte e gere outro Pix."; return; }
    try {
      const r = await chamarAssinatura("conferir_pix", { id: d.id });
      if (r?.status === "approved") {
        if (r.assinatura) S.plano = r.assinatura; else await carregarPlano();
        aviso("Pagamento confirmado! Bem-vindo ao Milhão Ouro."); if (location.hash === "#perfil") render(); return;
      }
      if (["rejected", "cancelled", "expired"].includes(r?.status)) { status.textContent = "Esse Pix não foi concluído. Volte e gere outro."; return; }
    } catch (e) { /* tenta de novo */ }
    setTimeout(conferir, 5000);
  };
  setTimeout(conferir, 5000);
}

    <h2>2. Para que usamos</h2><p>Só para fazer o Milhão funcionar: entrar na conta, mostrar suas carteiras em qualquer aparelho, liberar os recursos do seu plano e responder suas perguntas. Não vendemos seus dados e não mostramos anúncios.</p>
    <h2>3. Com quem os dados passam</h2><ul><li><b>Supabase</b>: login e banco de dados onde ficam sua conta e carteiras.</li><li><b>Google (Gemini)</b>: quando você pergunta ao Filtrão, a pergunta e um resumo da carteira e da tela vão para a IA do Google. Na camada gratuita, o Google pode usar esse conteúdo para melhorar os produtos dele. Não envie dados pessoais nas perguntas.</li><li><b>Mercado Pago</b>: processa os pagamentos do Milhão Ouro, no cartão ou no Pix. Os dados do cartão e da sua conta bancária ficam só com ele.</li><li><b>Cloudflare e GitHub</b>: hospedam o site.</li></ul>
    <h2>4. Seus direitos (LGPD)</h2><p>Você pode ver e corrigir seus dados no Perfil, baixar suas carteiras em "Exportar backup" e excluir tudo em "Excluir minha conta". Para qualquer outro pedido sobre seus dados, fale ${contato}.</p>
    <h2>5. Quanto tempo guardamos</h2><p>Enquanto sua conta existir. Ao excluir a conta, apagamos seus dados, exceto o que a lei mandar guardar (como registros de pagamento).</p>
    <h2>6. Segurança</h2><p>A conexão é criptografada (HTTPS) e cada pessoa só acessa os próprios dados, por regras no banco de dados. As senhas são guardadas cifradas pelo Supabase, e o Milhão nunca tem acesso a elas.</p>`;
  $("#raiz").innerHTML = `<main class="conteudo documento">
      <p><a href="#" id="doc-voltar" class="link-voltar">← Voltar</a></p>
      <article class="painel doc-texto">${qual === "termos" ? termos : privacidade}
        <p class="fraco" style="margin-top:24px">Veja também: ${qual === "termos" ? '<a href="#privacidade">Política de privacidade</a>' : '<a href="#termos">Termos de uso e assinatura</a>'}.</p></article></main>${rodapeSite()}`;
  $("#doc-voltar").onclick = (e) => { e.preventDefault(); if (history.length > 1) history.back(); else ir("#carteiras"); };
  window.scrollTo(0, 0);
}

const ORBITA_FILTRAO = [
  '<svg viewBox="0 0 16 16"><path d="M5 2.5v11M11 3.5v9" stroke="#7B8C83" stroke-width="1.2"/><rect x="3" y="5" width="4" height="6" rx="1" fill="#0F8A62"/><rect x="9" y="6" width="4" height="4" rx="1" fill="#C0432E"/></svg>',
